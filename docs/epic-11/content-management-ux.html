document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"275eab2f-b470-48c3-ab2f-6bf1c0203a34\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet data-dc-atomics=\"\"><meta name=\"design_doc_mode\" content=\"canvas\"><style>body{margin:0;background:#eceae5;font-family:-apple-system,Helvetica,system-ui,sans-serif}.dv-turn{padding:40px 44px 32px;border-bottom:1px solid rgba(0,0,0,.08);scroll-margin-top:16px}.dv-thd{display:flex;align-items:baseline;gap:10px;margin:0 0 20px}.dv-tid{font:600 10px ui-monospace,Menlo,monospace;padding:3px 7px;background:#1a1a1a;color:#fff;border-radius:4px;text-decoration:none}.dv-tname{font:600 13px/1.2 system-ui,sans-serif;color:#1a1a1a}.dv-opts{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start}.dv-opt{flex:none;display:flex;flex-direction:column;gap:9px;scroll-margin-top:16px}.dv-oid{font:600 10.5px ui-monospace,Menlo,monospace;padding:3px 7px;background:rgba(0,0,0,.08);color:#1a1a1a;border-radius:5px;text-decoration:none}.dv-olabel{display:flex;align-items:baseline;gap:8px;font:400 11px/1.3 system-ui,sans-serif;color:rgba(0,0,0,.55)}.dv-card{max-width:100%;background:#fff;border:1px solid #d5d2cc;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.06);overflow:hidden}.dv-opt:target .dv-oid{background:#2a78d6;color:#fff}.dv-next{margin:22px 0 0;font:12px/1.5 system-ui,sans-serif;color:rgba(0,0,0,.5)}a{color:#2a78d6}a:hover{color:#1b5aa8}<\u002Fstyle><\u002Fhelmet>\n\n\n<section class=\"dv-turn\" id=\"t2\">\n<div class=\"dv-thd\"><a class=\"dv-tid\" href=\"#t2\">2<\u002Fa><span class=\"dv-tname\">Manual Generation Studio — where the operator makes new media. Two shapes for the studio, then the screens.<\u002Fspan><\u002Fdiv>\n\n<div style=\"max-width:1180px;margin:0 0 22px;font:13px/1.65 system-ui;color:#413e3a\">\n<p style=\"margin:0 0 12px\">This answers <b>OD-3<\u002Fb> from turn 1 in the affirmative: operators can trigger generation. So the design has to carry the two things that make it dangerous — <b>cost<\u002Fb> and <b>content state<\u002Fb> — on every screen, and it must not become a workflow engine.<\u002Fp>\n<p style=\"margin:0 0 12px;padding:11px 13px;background:#fff;border:1px solid #2b2926;border-radius:6px\"><b>Non-negotiable rule that shapes everything below:<\u002Fb> a generated asset <b>always<\u002Fb> lands as <span style=\"font:11px ui-monospace,monospace\">under_review<\u002Fspan>, attributed to the character's <b>active<\u002Fb> identity version, never approved, never Primary. The Studio has no approve action anywhere. It hands off to the Review Queue <a class=\"dv-oid\" href=\"#W12\">W12<\u002Fa> and stops. Generation and approval stay two different jobs done by the same person at different times.<\u002Fp>\n<div style=\"padding:11px 13px;background:#f3f1ec;border:1px solid #d5d2cc;border-radius:6px;font:11.5px/1.6 system-ui\">\n<b>Explicitly out of scope this sprint<\u002Fb>, and stated as such in the UI so nobody looks for it: scheduling · recurring runs · triggers · branching · conditional logic · loops · parallel execution · workflow editing beyond reorder/remove · budget administration · multi-role approval. <b>A sequence is an ordered list of generation steps. Nothing else.<\u002Fb>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"dv-opts\">\n\n<div class=\"dv-opt\" id=\"2a\">\n<div class=\"dv-olabel\"><a class=\"dv-oid\" href=\"#2a\">2a<\u002Fa>Contextual composer — a drawer launched from the character, no new destination<\u002Fdiv>\n<div class=\"dv-card\" style=\"width:1080px\">\n<div style=\"display:flex;height:40px;align-items:center;gap:14px;padding:0 16px;background:#f6f4f0;border-bottom:1px solid #dcd9d3\"><span style=\"font:700 12px system-ui;color:#2b2926\">Over<span style=\"color:#e11d48\">18<\u002Fspan> Admin<\u002Fspan><span style=\"font:11px ui-monospace,monospace;color:#8f8a82\">Characters / Maria / Media<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;min-height:430px\">\n<div style=\"flex:1;background:#f6f4f0;padding:16px;position:relative\">\n<div style=\"opacity:.4\"><div style=\"display:flex;gap:16px;align-items:center\"><span style=\"font:700 16px system-ui;color:#1f1d1b\">Maria<\u002Fspan><span style=\"font:11px system-ui;color:#6b6660\">Media · 18 assets<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px\"><div style=\"height:110px;background:#e4e1db;border:1px solid #dcd9d3;border-radius:5px\"><\u002Fdiv><div style=\"height:110px;background:#e4e1db;border:1px solid #dcd9d3;border-radius:5px\"><\u002Fdiv><div style=\"height:110px;background:#e4e1db;border:1px solid #dcd9d3;border-radius:5px\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"position:absolute;bottom:16px;left:16px;font:11px system-ui;color:#7d7871\">Character context is implicit — never picked, never picked wrong.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"width:520px;flex:none;border-left:1px solid #cbc7c0;background:#fff;padding:16px 18px\">\n<div style=\"display:flex;align-items:center\"><div style=\"font:700 14px system-ui;color:#1f1d1b\">Generate for Maria<\u002Fdiv><div style=\"margin-left:auto;font:11px ui-monospace,monospace;color:#8f8a82\">✕<\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;gap:6px;margin-top:12px\"><span style=\"background:#2b2926;color:#fff;font:600 11px system-ui;padding:5px 11px;border-radius:14px\">Image<\u002Fspan><span style=\"border:1px solid #cbc7c0;color:#3a3835;font:600 11px system-ui;padding:4px 11px;border-radius:14px\">Video<\u002Fspan><span style=\"border:1px solid #cbc7c0;color:#3a3835;font:600 11px system-ui;padding:4px 11px;border-radius:14px\">Run a sequence<\u002Fspan><\u002Fdiv>\n<div style=\"margin-top:14px\"><div style=\"font:600 11px system-ui;color:#3a3835;margin-bottom:5px\">Prompt<\u002Fdiv><div style=\"border:1px solid #b6b1a9;border-radius:5px;padding:9px 11px;height:56px\"><div style=\"height:6px;width:84%;background:#dedbd5;border-radius:3px\"><\u002Fdiv><div style=\"height:6px;width:58%;background:#dedbd5;border-radius:3px;margin-top:7px\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:11px\">\n<div><div style=\"font:600 11px system-ui;color:#3a3835;margin-bottom:5px\">Reference<\u002Fdiv><div style=\"border:1px solid #cbc7c0;border-radius:5px;padding:8px 10px;font:11px system-ui;color:#3a3835\">◆ Primary 1 ▾<\u002Fdiv><\u002Fdiv>\n<div><div style=\"font:600 11px system-ui;color:#3a3835;margin-bottom:5px\">Size<\u002Fdiv><div style=\"border:1px solid #cbc7c0;border-radius:5px;padding:8px 10px;font:11px system-ui;color:#3a3835\">1080 × 1920 ▾<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:11px;padding:11px;border:1px solid #dcd9d3;border-radius:6px;display:flex;align-items:center;gap:12px\"><div><div style=\"font:9.5px ui-monospace,monospace;color:#8f8a82\">ESTIMATED COST<\u002Fdiv><div style=\"font:700 16px system-ui;color:#1f1d1b;margin-top:2px\">$0.04<\u002Fdiv><\u002Fdiv><div style=\"font:10.5px/1.5 system-ui;color:#6b6660;flex:1\">1 image · runpod · <span style=\"font:10px ui-monospace,monospace\">sdxl-turbo<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"margin-top:11px;padding:10px 11px;border:1px dashed #cbc7c0;border-radius:6px;font:10.5px/1.55 system-ui;color:#6b6660\">Lands as <b>pending review<\u002Fb> on identity v2, rated as set below. It will appear in the Review Queue.<\u002Fdiv>\n<div style=\"display:flex;gap:8px;margin-top:14px;align-items:center\"><div style=\"background:#2b2926;color:#fff;font:600 12px system-ui;padding:9px 16px;border-radius:5px\">Generate · $0.04<\u002Fdiv><div style=\"background:#fff;border:1px solid #cbc7c0;color:#3a3835;font:600 11.5px system-ui;padding:8px 13px;border-radius:5px\">Cancel<\u002Fdiv><span style=\"margin-left:auto;font:10.5px system-ui;color:#7d7871\">Rating: Safe ▾<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"border-top:1px solid #dcd9d3;background:#faf9f6;padding:11px 16px;font:11px/1.55 system-ui;color:#6b6660\"><b style=\"color:#2b2926\">Trade-off.<\u002Fb> Fastest path for \"one more image of Maria\", zero new navigation, character and identity version can't be chosen wrongly. But <b>saved sequences have no home<\u002Fb> — you can run one, not find, build or manage them — and cross-character work means opening four characters. Right for single jobs, wrong for the sequence half of the brief.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"dv-opt\" id=\"2b\">\n<div class=\"dv-olabel\"><a class=\"dv-oid\" href=\"#2b\">2b<\u002Fa>Dedicated Studio destination, three modes — <b style=\"color:#1a1a1a\">recommended<\u002Fb><\u002Fdiv>\n<div class=\"dv-card\" style=\"width:1080px\">\n<div style=\"display:flex;height:40px;align-items:center;gap:14px;padding:0 16px;background:#f6f4f0;border-bottom:1px solid #dcd9d3\"><span style=\"font:700 12px system-ui;color:#2b2926\">Over<span style=\"color:#e11d48\">18<\u002Fspan> Admin<\u002Fspan><span style=\"font:11px ui-monospace,monospace;color:#8f8a82\">Studio<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex\">\n<div style=\"width:158px;flex:none;background:#faf9f6;border-right:1px solid #dcd9d3;padding:14px 10px;min-height:470px\"><div style=\"font:11px system-ui;color:#6b6660;padding:6px 8px\">Today<\u002Fdiv><div style=\"font:11px system-ui;color:#6b6660;padding:6px 8px\">Characters<\u002Fdiv><div style=\"font:11px system-ui;color:#6b6660;padding:6px 8px\">Media Library<\u002Fdiv><div style=\"font:600 11px system-ui;color:#2b2926;padding:6px 8px;background:#e8e5e0;border-radius:4px\">Studio<\u002Fdiv><div style=\"font:11px system-ui;color:#6b6660;padding:6px 8px;display:flex;justify-content:space-between\">Review Queue<span style=\"background:#2b2926;color:#fff;font:700 9px ui-monospace,monospace;padding:1px 5px;border-radius:8px\">9<\u002Fspan><\u002Fdiv><div style=\"font:11px system-ui;color:#6b6660;padding:6px 8px\">Activity<\u002Fdiv><\u002Fdiv>\n<div style=\"flex: v style=\"flex:1\"><div style=\"display:flex;align-items:center;gap:8px\"><span style=\"border:1px solid #2b2926;color:#2b2926;font:700 8.5px ui-monospace,monospace;padding:2px 6px;border-radius:3px\">IMAGE<\u002Fspan><span style=\"font:600 12px system-ui;color:#1f1d1b\">close crop, evening<\u002Fspan><span style=\"margin-left:auto;font:10.5px ui-monospace,monospace;color:#6b6660\">$0.04<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"border:2px solid #2b2926;border-radius:7px;padding:12px;display:flex;gap:12px;align-items:flex-start;background:#faf9f6\">\n<div style=\"width:22px;flex:none;display:flex;flex-direction:column;align-items:center;gap:5px;padding-top:2px\"><span style=\"font:700 11px ui-monospace,monospace;color:#2b2926\">4<\u002Fspan><span style=\"font:12px;color:#a5a098\">⠿<\u002Fspan><\u002Fdiv>\n<div style=\"flex:1\">\n<div style=\"display:flex;align-items:center;gap:8px\"><span style=\"background:#2b2926;color:#fff;font:700 8.5px ui-monospace,monospace;padding:2px 6px;border-radius:3px\">VIDEO<\u002Fspan><span style=\"font:600 12px system-ui;color:#1f1d1b\">slow turn, soft smile<\u002Fspan><span style=\"margin-left:auto;font:10.5px ui-monospace,monospace;color:#6b6660\">$0.42<\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px\">\n<div><div style=\"font:600 10.5px system-ui;color:#3a3835;margin-bottom:4px\">Source image<\u002Fdiv><div style=\"border:1px solid #b6b1a9;border-radius:5px;padding:7px 9px;font:11px system-ui;color:#1f1d1b\">↑ Output of step 1 ▾<\u002Fdiv><\u002Fdiv>\n<div><div style=\"font:600 10.5px system-ui;color:#3a3835;margin-bottom:4px\">Duration / resolution<\u002Fdiv><div style=\"border:1px solid #cbc7c0;border-radius:5px;padding:7px 9px;font:11px system-ui;color:#3a3835\">6 s · 720p ▾<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:9px;padding:9px 10px;border:1px dashed #2b2926;border-radius:5px;font:10.5px/1.55 system-ui;color:#3a3835\"><b>The one dependency the builder allows.<\u002Fb> A video step's source can be an earlier step's output or an existing approved image. That is the whole of \"step ordering matters\" — no other step can read another step's result, and there is no branching, no condition, no loop.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"border:1px dashed #cbc7c0;border-radius:7px;padding:13px;display:flex;gap:10px;align-items:center\"><span style=\"font:11.5px system-ui;color:#6b6660\">Add step:<\u002Fspan><span style=\"background:#fff;border:1px solid #cbc7c0;color:#3a3835;font:600 11px system-ui;padding:6px 12px;border-radius:5px\">+ Image<\u002Fspan><span style=\"background:#fff;border:1px solid #cbc7c0;color:#3a3835;font:600 11px system-ui;padding:6px 12px;border-radius:5px\">+ Video<\u002Fspan><span style=\"font:10.5px system-ui;color:#8f8a82;margin-left:4px\">Max 12 steps.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"width:270px;flex:none;border-left:1px solid #dcd9d3;padding-left:16px\">\n<div style=\"font:700 9px ui-monospace,monospace;color:#8f8a82;letter-spacing:.07em\">SEQUENCE ESTIMATE<\u002Fdiv>\n<div style=\"margin-top:9px;padding:11px;border:1px solid #dcd9d3;border-radius:6px\"><div style=\"font:700 19px system-ui;color:#1f1d1b\">$0.54<\u002Fdiv><div style=\"font:10.5px/1.5 system-ui;color:#6b6660;margin-top:5px\">3 images @ $0.04 · 1 video @ $0.42. Per run, per character.<\u002Fdiv><\u002Fdiv>\n<div style=\"margin-top:11px;padding:11px;border:1px solid #dcd9d3;border-radius:6px\"><div style=\"font:700 9px ui-monospace,monospace;color:#8f8a82;letter-spacing:.07em\">HOW A SEQUENCE BEHAVES<\u002Fdiv><div style=\"margin-top:8px;display:flex;flex-direction:column;gap:6px;font:10.5px/1.55 system-ui;color:#3a3835\"><div>· Steps run <b>in order, one at a time<\u002Fb><\u002Fdiv><div>· A step is <b>not<\u002Fb> character-specific — you pick the character at run time<\u002Fdiv><div>· \"◆ Primary 1\" resolves to whichever image is Primary for that character<\u002Fdiv><div>· A failed step <b>stops the run<\u002Fb>; earlier assets are kept and still go to review<\u002Fdiv><div>· Every produced asset lands <b>pending review<\u002Fb><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"margin-top:11px;padding:10px 11px;border:1px dashed #cbc7c0;border-radius:6px;font:10.5px/1.55 system-ui;color:#6b6660\"><b style=\"color:#2b2926\">Deliberately absent:<\u002Fb> triggers, schedules, conditions, retries-with-variation, parallel steps, sub-sequences, variables. If a step needs judgement, that judgement belongs to the operator at run time.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"border-top:1px solid #dcd9d3;background:#faf9f6;padding:12px 16px;display:grid;grid-template-columns:repeat(5,1fr);gap:16px;font:11px/1.55 system-ui;color:#4a4743\">\n<div><b style=\"color:#2b2926\">Purpose<\u002Fb><br>Save a repeatable ordered list of generation jobs — the sets an operator runs over and over.<\u002Fdiv>\n<div><b style=\"color:#2b2926\">Entry<\u002Fb><br>Sequences → New; \"save as sequence step\" from a single job; Edit / Duplicate on an existing sequence.<\u002Fdiv>\n<div><b style=\"color:#2b2926\">Primary action<\u002Fb><br>Save sequence. <b>Secondary:<\u002Fb> add / edit / duplicate / remove step, drag to reorder, rename.<\u002Fdiv>\n<div><b style=\"color:#2b2926\">Information hierarchy<\u002Fb><br>Ordinal → job type → prompt summary → resolved parameters in one monospace line → cost. Steps read as a list, top to bottom, because that is exactly how they execute.<\u002Fdiv>\n<div><b style=\"color:#2b2926\">States<\u002Fb><br>Empty (one dashed \"add step\" affordance, nothing else) · unsaved changes (leave → confirm) · invalid step (missing prompt or source → step marked ✕, save allowed, run blocked) · a step whose source references a removed step (auto-falls back to \"Primary 1\" with a visible notice) · editing a sequence that is mid-run (read-only until the run ends) · 12-step cap reached.<\u002Fdiv>\n<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"W20\" style=\"scroll-margin-top:16px\">\n<div style=\"display:flex;align-items:baseline;gap:10px;margin-bottom:9px\"><span style=\"font:700 10.5px ui-monospace,monospace;background:#1a1a1a;color:#fff;padding:3px 7px;border-radius:4px\">W20<\u002Fspan><span style=\"font:600 13px system-ui;color:#1a1a1a\">Run monitor<\u002Fspan><\u002Fdiv>\n<div style=\"width:1180px;background:#fff;border:1px solid #d5d2cc;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.06);overflow:hidden\">\n<div style=\"padding:16px 20px 20px\">\n<div style=\"display:flex;gap:20px;margin:0 0 16px;border-bottom:1px solid #dcd9d3\"><span style=\"font:12px system-ui;color:#7d7871;padding-bottom:9px\">Single job<\u002Fspan><span style=\"font:12px system-ui;color:#7d7871;padding-bottom:9px\">Sequences<\u002Fspan><span style=\"font:600 12px system-ui;color:#1f1d1b;padding-bottom:9px;border-bottom:2px solid #1f1d1b\">Runs<\u002Fspan><\u002Fdiv>\n<div style=\"border:1px solid #2b2926;border-radius:7px;overflow:hidden\">\n<div style=\"display:flex;align-items:center;gap:12px;padding:11px 13px;background:#2b2926;color:#fff\"><span style=\"font:700 10px ui-monospace,monospace;letter-spacing:.07em\">RUNNING — \"PORTRAIT SET\" ON SAGE<\u002Fspan><span style=\"font:10.5px ui-monospace,monospace;opacity:.75\">step 2 of 4 · $0.08 spent of $0.54 est.<\u002Fspan><span style=\"margin-left:auto;background:#fff;color:#2b2926;font:600 10.5px system-ui;padding:4px 11px;border-radius:4px\">Stop after this step<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:12px;padding:10px 13px;border-bottom:1px solid #f0ede8;font:11.5px system-ui;color:#3a3835\"><span style=\"width:16px;font:10px ui-monospace,monospace;color:#a5a098\">1<\u002Fspan><span style=\"width:34px;height:42px;background:#e4e1db;border:1px solid #d9d6d0;border-radius:3px\"><\u002Fspan><span style=\"flex:1\">Image · portrait, soft light<\u002Fspan><span style=\"border:1px dashed #2b2926;color:#2b2926;font:700 8.5px ui-monospace,monospace;padding:2px 6px;border-radius:3px\">⏱ PENDING REVIEW<\u002Fspan><span style=\"width:60px;font:10.5px ui-monospace,monospace;color:#6b6660;text-align:right\">$0.04<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:12px;padding:10px 13px;border-bottom:1px solid #f0ede8;font:11.5px system-ui;color:#3a3835;background:#faf9f6\"><span style=\"width:16px;font:10px ui-monospace,monospace;color:#a5a098\">2<\u002Fspan><span style=\"width:34px;height:42px;background:#efece7;border:1px dashed #b6b1a9;border-radius:3px;display:flex;align-items:center;justify-content:center;font:8px ui-monospace,monospace;color:#a5a098\">···<\u002Fspan><span style=\"flex:1\">Image · full length, street<\u002Fspan><span style=\"border:1px solid #2b2926;background:#2b2926;color:#fff;font:700 8.5px ui-monospace,monospace;padding:2px 6px;border-radius:3px\">GENERATING<\u002Fspan><span style=\"width:60px;font:10.5px ui-monospace,monospace;color:#6b6660;text-align:right\">$0.04<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:12px;padding:10px 13px;border-bottom:1px solid #f0ede8;font:11.5px system-ui;color:#8f8a82\"><span style=\"width:16px;font:10px ui-monospace,monospace;color:#c0bbb3\">3<\u002Fspan><span style=\"width:34px;height:42px;background:#f4f2ee;border:1px solid #ece9e4;border-radius:3px\"><\u002Fspan><span style=\"flex:1\">Image · close crop, evening<\u002Fspan><span style=\"border:1px solid #dcd9d3;color:#a5a098;font:700 8.5px ui-monospace,monospace;padding:2px 6px;border-radius:3px\">QUEUED<\u002Fspan><span style=\"width:60px;font:10.5px ui-monospace,monospace;text-align:right\">$0.04<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:12px;padding:10px 13px;font:11.5px system-ui;color:#8f8a82\"><span style=\"width:16px;font:10px ui-monospace,monospace;color:#c0bbb3\">4<\u002Fspan><span style=\"width:34px;height:42px;background:#f4f2ee;border:1px solid #ece9e4;border-radius:3px\"><\u002Fspan><span style=\"flex:1\">Video · 6 s, 720p — from step 1<\u002Fspan><span style=\"border:1px solid #dcd9d3;color:#a5a098;font:700 8.5px ui-monospace,monospace;padding:2px 6px;border-radius:3px\">QUEUED<\u002Fspan><span style=\"width:60px;font:10.5px ui-monospace,monospace;text-align:right\">$0.42<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:11px;font:11px/1.6 system-ui;color:#6b6660\">Assets appear in review <b>as each step finishes<\u002Fb>, not at the end — a stopped or failed run still hands over everything it produced. Leaving the page doesn't cancel the run; the Runs tab and a sidebar indicator carry it.<\u002Fdiv>\n\n<div style=\"margin-top:16px;font:700 9px ui-monospace,monospace;color:#8f8a82;letter-spacing:.07em\">EARLIER RUNS<\u002Fdiv>\n<div style=\"margin-top:9px;border:1px solid #dcd9d3;border-radius:7px;overflow:hidden\">\n<div style=\"display:flex;align-items:center;gap:12px;padding:9px 13px;border-bottom:1px solid #f0ede8;font:11.5px system-ui;color:#3a3835\"><span style=\"width:120px\">Maria<\u002Fspan><span style=\"flex:1\">Single job · image<\u002Fspan><span style=\"width:90px;font:10.5px ui-monospace,monospace;color:#6b6660\">2h ago<\u002Fspan><span style=\"width:60px;font:10.5px ui-monospace,monospace;color:#6b6660\">$0.04<\u002Fspan><span style=\"width:110px;font:10.5px system-ui;color:#3a3835\">✓ 1 in review<\u002Fspan><span style=\"font:10.5px system-ui;color:#2a78d6\">Run again<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:12px;padding:9px 13px;border-bottom:1px solid #f0ede8;font:11.5px system-ui;color:#3a3835\"><span style=\"width:120px\">Sage<\u002Fspan><span style=\"flex:1\">\"Portrait set\"<\u002Fspan><span style=\"width:90px;font:10.5px ui-monospace,monospace;color:#6b6660\">Thu<\u002Fspan><span style=\"width:60px;font:10.5px ui-monospace,monospace;color:#6b6660\">$0.54<\u002Fspan><span style=\"width:110px;font:10.5px system-ui;color:#3a3835\">✓ 4 in review<\u002Fspan><span style=\"font:10.5px system-ui;color:#2a78d6\">Run again<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:12px;padding:9px 13px;font:11.5px system-ui;color:#3a3835\"><span style=\"width:120px\">Ember<\u002Fspan><span style=\"flex:1\">Single job · video<\u002Fspan><span style=\"width:90px;font:10.5px ui-monospace,monospace;color:#6b6660\">Wed<\u002Fspan><span style=\"width:60px;font:10.5px ui-monospace,monospace;color:#6b6660\">$0.00<\u002Fspan><span style=\"width:110px;font:10.5px system-ui;color:#1f1d1b\">✕ refused<\u002Fspan><span style=\"font:10.5px system-ui;color:#2a78d6\">Details<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"border-top:1px solid #dcd9d3;background:#faf9f6;padding:12px 16px;display:grid;grid-template-columns:repeat(5,1fr);gap:16px;font:11px/1.55 system-ui;color:#4a4743\">\n<div><b style=\"color:#2b2926\">Purpose<\u002Fb><br>Show what is generating right now, what it has cost so far, and where the results went.<\u002Fdiv>\n<div><b style=\"color:#2b2926\">Entry<\u002Fb><br>Automatically after starting a run; Studio → Runs; sidebar running indicator.<\u002Fdiv>\n<div><b style=\"color:#2b2926\">Primary action<\u002Fb><br>Watch, or <b>stop after this step<\u002Fb> — the honest control, since a call in flight is already paid for. <b>Secondary:<\u002Fb> open a produced asset; run again; view details of a failure.<\u002Fdiv>\n<div><b style=\"color:#2b2926\">Must see<\u002Fb><br>Which step is running, spend so far vs estimate, and that finished assets are already pending review.<\u002Fdiv>\n<div><b style=\"color:#2b2926\">States<\u002Fb><br>Queued · generating · succeeded (with the resulting thumbnail and PENDING REVIEW badge) · <b>failed<\u002Fb> (step marked, remaining steps cancelled, reason in plain words) · <b>stopped by operator<\u002Fb> · <b>budget refused<\u002Fb> (nothing spent, $0.00) · run history empty · two concurrent runs (allowed; a third queues).<\u002Fdiv>\n<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"W21\" style=\"scroll-margin-top:16px\">\n<div style=\"display:flex;align-items:baseline;gap:10px;margin-bottom:9px\"><span style=\"font:700 10.5px ui-monospace,monospace;background:#1a1a1a;color:#fff;padding:3px 7px;border-radius:4px\">W21<\u002Fspan><span style=\"font:600 13px system-ui;color:#1a1a1a\">Handoff to review, and the failure states<\u002Fspan><\u002Fdiv>\n<div style=\"width:1180px;display:grid;grid-template-columns:1fr 1fr;gap:14px\">\n\n<div style=\"background:#fff;border:1px solid #d5d2cc;border-radius:8px;padding:16px 18px\">\n<div style=\"font:700 12px system-ui;color:#1f1d1b\">Run complete — the handoff<\u002Fdiv>\n<div style=\"margin-top:12px;border:1px solid #2b2926;border-radius:7px;padding:13px;background:#faf9f6\">\n<div style=\"font:600 12.5px system-ui;color:#1f1d1b\">4 assets created for Sage<\u002Fdiv>\n<div style=\"font:11px/1.6 system-ui;color:#4a4743;margin-top:6px\">All 4 are <b>pending review<\u002Fb> on identity v1 and are already in the Review Queue. None is approved, none is Primary, none is visible to users.<\u002Fdiv>\n<div style=\"display:flex;gap:7px;margin-top:11px\"><span style=\"width:52px;height:64px;background:#e4e1db;border:1px dashed #2b2926;border-radius:4px\"><\u002Fspan><span style=\"width:52px;height:64px;background:#e4e1db;border:1px dashed #2b2926;border-radius:4px\"><\u002Fspan><span style=\"width:52px;height:64px;background:#e4e1db;border:1px dashed #2b2926;border-radius:4px\"><\u002Fspan><span style=\"width:52px;height:64px;background:#e4e1db;border:1px dashed #2b2926;border-radius:4px;display:flex;align-items:center;justify-content:center;font:9px ui-monospace,monospace;color:#948e86\">▶<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;gap:8px;margin-top:13px;align-items:center\"><div style=\"background:#2b2926;color:#fff;font:600 11.5px system-ui;padding:9px 15px;border-radius:5px\">Review these 4 now<\u002Fdiv><div style=\"background:#fff;border:1px solid #cbc7c0;color:#3a3835;font:600 11px system-ui;padding:8px 13px;border-radius:5px\">Open Sage's media<\u002Fdiv><span style=\"font:10.5px system-ui;color:#7d7871\">Total $0.54<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:12px;font:11px/1.6 system-ui;color:#4a4743\"><b style=\"color:#2b2926\">\"Review these 4 now\"<\u002Fb> opens the Review Queue <a class=\"dv-oid\" href=\"#W12\">W12<\u002Fa> filtered to this run, entering the drawer <a class=\"dv-oid\" href=\"#W11\">W11<\u002Fa> in sequence with the usual A / R / S keys. Generation and approval remain separate acts — the Studio never approves, and the reviewer sees the same Source &amp; History as any other asset.<\u002Fdiv>\n<div style=\"margin-top:12px;padding:11px;border:1px dashed #cbc7c0;border-radius:6px;font:10.5px/1.6 system-ui;color:#6b6660\"><b style=\"color:#2b2926\">Effect on the rest of the admin:<\u002Fb> Review Queue count rises · the character's Media tab gains 4 pending tiles · Needs Attention will flag them after 48 h <a class=\"dv-oid\" href=\"#W14\">W14<\u002Fa> · Activity records the run, the operator, the cost and the assets <a class=\"dv-oid\" href=\"#W01\">W01<\u002Fa>.<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"background:#fff;border:1px solid #d5d2cc;border-radius:8px;padding:16px 18px\">\n<div style=\"font:700 12px system-ui;color:#1f1d1b\">Failures, in the operator's language<\u002Fdiv>\n<div style=\"margin-top:12px;display:flex;flex-direction:column;gap:9px\">\n<div style=\"border:1px solid #2b2926;border-radius:6px;padding:11px\"><div style=\"font:600 11.5px system-ui;color:#1f1d1b\">Run refused — budget<\u002Fdiv><div style=\"font:10.5px/1.55 system-ui;color:#4a4743;margin-top:4px\">\"This run would cost $0.42 and Ember has $0.18 left of her generation budget. <b>Nothing was spent.<\u002Fb>\" → Reduce duration · Choose 480p · Ask for more budget. <span style=\"color:#8f8a82\">Refused locally, before any paid call.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div style=\"border:1px solid #dcd9d3;border-radius:6px;padding:11px\"><div style=\"font:600 11.5px system-ui;color:#1f1d1b\">Parameter not supported<\u002Fdiv><div style=\"font:10.5px/1.55 system-ui;color:#4a4743;margin-top:4px\">\"This model can't do 15 s at 1080p. Longest at 1080p is 8 s.\" Shown as a disabled option with the reason, so it can't be submitted at all.<\u002Fdiv><\u002Fdiv>\n<div style=\"border:1px solid #dcd9d3;border-radius:6px;padding:11px\"><div style=\"font:600 11.5px system-ui;color:#1f1d1b\">Provider failed<\u002Fdiv><div style=\"font:10.5px/1.55 system-ui;color:#4a4743;margin-top:4px\">\"The image service didn't respond. Nothing was created and you weren't charged for step 3.\" → Retry step · Stop run. One plain sentence per failure kind — auth, network, service error, unusable response, unverified output — never a status code or an error enum.<\u002Fdiv><\u002Fdiv>\n<div style=\"border:1px solid #dcd9d3;border-radius:6px;padding:11px\"><div style=\"font:600 11.5px system-ui;color:#1f1d1b\">Blocked before you start<\u002Fdiv><div style=\"font:10.5px/1.55 system-ui;color:#4a4743;margin-top:4px\">\"Luna has no active Visual Identity — there's nothing to keep her looking consistent.\" · \"Sage has no approved image to animate.\" Both link straight to the fix, and the Run button stays disabled with that reason on hover.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:12px;padding:11px;background:#faf9f6;border:1px solid #dcd9d3;border-radius:6px;font:10.5px/1.6 system-ui;color:#4a4743\"><b style=\"color:#2b2926\">Rule.<\u002Fb> Every failure message says three things: what happened, whether money was spent, and what to do next. The operator should never need to ask a developer to interpret a generation failure — that is the same standard as the rest of the epic.<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"max-width:1180px;margin:30px 0 0;background:#fff;border:1px solid #d5d2cc;border-radius:8px;padding:18px 20px\">\n<div style=\"font:700 12px system-ui;color:#1f1d1b\">Where this lands in the plan, and what it needs decided<\u002Fdiv>\n<div style=\"display:flex;gap:24px;flex-wrap:wrap;margin-top:12px\">\n<div style=\"flex:1;min-width:420px;font:11.5px/1.7 system-ui;color:#4a4743\">\n<b style=\"color:#2b2926\">IA change:<\u002Fb> one new sidebar destination, <b>Studio<\u002Fb>, between Media Library and Review Queue, with three tabs (Single job · Sequences · Runs). Character Detail's \"Generate media\" button now opens Studio pre-filled instead of being deferred.<br>\n<b style=\"color:#2b2926\">Implementation slot:<\u002Fb> after slice 5 (approval actions), because the Studio's entire value depends on the review workflow existing to receive its output. Build order within it: single image job → single video job → run monitor → sequence run → sequence builder.<br>\n<b style=\"color:#2b2926\">New components:<\u002Fb> <span style=\"font:10.5px ui-monospace,monospace\">JobComposer<\u002Fspan> · <span style=\"font:10.5px ui-monospace,monospace\">CostEstimate<\u002Fspan> · <span style=\"font:10.5px ui-monospace,monospace\">DestinationNotice<\u002Fspan> · <span style=\"font:10.5px ui-monospace,monospace\">SequenceList<\u002Fspan> · <span style=\"font:10.5px ui-monospace,monospace\">SequenceStepRow<\u002Fspan> · <span style=\"font:10.5px ui-monospace,monospace\">RunMonitor<\u002Fspan> · <span style=\"font:10.5px ui-monospace,monospace\">RunSummary<\u002Fspan>. Everything else is reused: <span style=\"font:10.5px ui-monospace,monospace\">StateBadge<\u002Fspan>, <span style=\"font:10.5px ui-monospace,monospace\">MediaTile<\u002Fspan>, <span style=\"font:10.5px ui-monospace,monospace\">ConfirmDialog<\u002Fspan>, <span style=\"font:10.5px ui-monospace,monospace\">EmptyState<\u002Fspan>.\n<\u002Fdiv>\n<div style=\"flex:1;min-width:420px\">\n<div style=\"font:700 9px ui-monospace,monospace;color:#8f8a82;letter-spacing:.07em\">NEW OPEN DECISIONS<\u002Fdiv>\n<div style=\"margin-top:9px;display:flex;flex-direction:column;gap:9px;font:11.5px/1.6 system-ui;color:#4a4743\">\n<div><b style=\"color:#2b2926\">GD-1 · Whose budget, and is it visible?<\u002Fb> The design shows a per-character remaining budget and refuses locally when a run would exceed it. Confirm the budget is per character (not per operator or per month) and that operators may see the number. Advanced budget administration is out of scope — this is display plus refusal only.<\u002Fdiv>\n<div><b style=\"color:#2b2926\">GD-2 · Can an operator choose the provider/model, or is it fixed?<\u002Fb> Shown as changeable but pre-set to the same bundle the automated system uses. Locking it removes a whole class of \"why does this look different\" support questions; exposing it helps comparison work.<\u002Fdiv>\n<div><b style=\"color:#2b2926\">GD-3 · Are sequences shared or personal?<\u002Fb> Assumed shared across all operators, since there is one role. If sequences should be private drafts, the list needs an owner column and a share action.<\u002Fdiv>\n<div><b style=\"color:#2b2926\">GD-4 · Explicit-rated generation — any pre-flight gate?<\u002Fb> The design lets an operator set Explicit on a job and relies on downstream review. If policy needs an acknowledgement before generating adult content, it belongs on the Run button, not in the review step.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<p class=\"dv-next\">Try next: \"go with <a class=\"dv-oid\" href=\"#2b\">2b<\u002Fa> and start building <a class=\"dv-oid\" href=\"#W17\">W17<\u002Fa>\" · \"drop the sequence builder to 6 steps max\" · \"show the Studio with the character-scoped entry from <a class=\"dv-oid\" href=\"#2a\">2a<\u002Fa>\".<\u002Fp>\n<\u002Fdiv><\u002Fsection>\n\n<section class=\"dv-turn\" id=\"t1\">\n<div class=\"dv-thd\"><a class=\"dv-tid\" href=\"#t1\">1<\u002Fa><span class=\"dv-tname\">Character Detail — three structures. This is the screen everything else hangs off, so it goes first.<\u002Fspan><\u002Fdiv>\n\n<div style=\"max-width:1180px;margin:0 0 26px;font:13px/1.65 system-ui;color:#413e3a\">\n<p style=\"margin:0 0 10px\">Grounded in the real codebase (<span style=\"font:11px ui-monospace,monospace;background:#e4e1db;padding:1px 5px;border-radius:3px\">apps/api/src/db/schema.ts<\u002Fspan>): a character has <b>one active visual identity version<\u002Fb> (DB-enforced), identities are <span style=\"font:11px ui-monospace,monospace\">draft / active / retired<\u002Fspan>, assets are <span style=\"font:11px ui-monospace,monospace\">generated → under_review → approved / rejected<\u002Fspan> with <span style=\"font:11px ui-monospace,monospace\">is_canonical<\u002Fspan> and <span style=\"font:11px ui-monospace,monospace\">content_rating<\u002Fspan> flags. The public API only ever projects the <b>active identity + approved primary references<\u002Fb> — which is exactly why <b>Approved ≠ Published<\u002Fb>. The wireframes below make that derivation visible instead of leaving it in the query layer.<\u002Fp>\n<p style=\"margin:0;padding:11px 13px;background:#fff;border:1px solid #2b2926;border-radius:6px\"><b>Operator language vs data-model language.<\u002Fb> The UI says <b>Primary<\u002Fb> for the main approved visual reference — the data model stores it as <span style=\"font:11px ui-monospace,monospace\">is_canonical<\u002Fspan>, and that name stays in the code. Likewise the operator sees <b>Source &amp; History<\u002Fb> where the schema calls it <span style=\"font:11px ui-monospace,monospace\">provenance<\u002Fspan>. The words \"canonical\" and \"provenance\" never appear in operator-facing UI.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"max-width:1180px;margin:0 0 30px;padding:16px 18px;background:#fff;border:1px solid #d5d2cc;border-radius:8px\">\n<div style=\"font:700 10px ui-monospace,Menlo,monospace;letter-spacing:.08em;color:#8f8a82;margin-bottom:12px\">STATE BADGE VOCABULARY — used identically on every screen<\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:20px;align-items:center\">\n<div style=\"display:flex;align-items:center;gap:7px\"><span x 5px;border-radius:3px;margin-left:4px\">DRAFT<\u002Fspan><\u002Fdiv><div style=\"font:10px ui-monospace,monospace;color:#8f8a82;margin-top:6px\">created 14 Aug<\u002Fdiv><\u002Fdiv>\n        <div style=\"flex:2;border:1px dashed #cbc7c0;border-radius:6px;padding:11px;font:11px/1.5 system-ui;color:#7d7871\">Visual DNA — 9 identity attributes recorded. Generation will use this version once activated.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-top:20px;padding-top:14px;border-top:1px solid #dcd9d3;font:700 9px ui-monospace,monospace;color:#8f8a82;letter-spacing:.07em\">REFERENCE ASSETS <span style=\"color:#c0bbb3\">— empty<\u002Fspan><\u002Fdiv>\n      <div style=\"margin-top:9px;border:1px dashed #cbc7c0;border-radius:6px;padding:22px;text-align:center;font:11px system-ui;color:#7d7871\">Drop images here, or <span style=\"color:#2a78d6\">browse<\u002Fspan>. The first approved reference becomes primary.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"border-top:1px solid #dcd9d3;background:#faf9f6;padding:11px 16px;font:11px/1.55 system-ui;color:#6b6660\"><b style=\"color:#2b2926\">Trade-off.<\u002Fb> Nothing is hidden and incomplete characters read beautifully — but for a healthy character with hundreds of assets the page becomes very long and media has to be truncated into \"see all\" links, which reintroduces tabs by another name. Best as the <i>Draft-state<\u002Fi> presentation of <a class=\"dv-oid\" href=\"#1b\">1b<\u002Fa> rather than the whole pattern.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<p class=\"dv-next\">Full deliverable — IA, lifecycle, flow, W01–W16 and the spec — is in the sections below, drawn using <a class=\"dv-oid\" href=\"#1b\">1b<\u002Fa>. Try next: \"go with <a class=\"dv-oid\" href=\"#1b\">1b<\u002Fa>, but use <a class=\"dv-oid\" href=\"#1c\">1c<\u002Fa>'s blocked banner for drafts\" · \"show me the catalogue as a dense table instead of cards\" · \"start implementing W01–W02\".<\u002Fp>\n<\u002Fsection>\n\n<section style=\"padding:40px 44px 34px;border-bottom:1px solid rgba(0,0,0,.08);max-width:1300px\" id=\"lifecycle\">\n<div style=\"font:700 10px ui-monospace,Menlo,monospace;letter-spacing:.09em;color:#8f8a82\">PART G+H · FIRST, BECAUSE EVERY SCREEN DEPENDS ON IT<\u002Fdiv>\n<h2 style=\"font:700 22px system-ui;color:#1a1a1a;margin:8px 0 6px\">Lifecycle &amp; state model<\u002Fh2>\n<p style=\"max-width:760px;font:13px/1.65 system-ui;color:#4a4743;margin:0 0 24px\">The brief proposes six character states and five media states. The database today stores only <span style=\"font:11px ui-monospace,monospace;background:#e4e1db;padding:1px 5px;border-radius:3px\">active | inactive<\u002Fspan> for characters. My recommendation is to <b>keep it that way<\u002Fb> and derive the rest — a stored \"Ready\" flag goes stale the moment an asset is rejected, and a stored \"Published\" flag can silently disagree with what the API actually serves.<\u002Fp>\n\n<div style=\"display:flex;flex-wrap:wrap;gap:24px\">\n\n<div style=\"flex:1;min-width:520px;background:#fff;border:1px solid #d5d2cc;border-radius:8px;padding:20px\">\n<div style=\"font:700 12px system-ui;color:#1f1d1b\">Character lifecycle — 2 stored states, 3 derived<\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:16px 0 4px\">\n<div style=\"border:1px dashed #8f8a82;border-radius:5px;padding:8px 11px;font:600 11px system-ui;color:#3a3835\">Draft<\u002Fdiv><span style=\"color:#a5a098\">→<\u002Fspan>\n<div style=\"border:1px solid #b6b1a9;border-radius:5px;padding:8px 11px;font:600 11px system-ui;color:#3a3835\">Ready<\u002Fdiv><span style=\"color:#a5a098\">→<\u002Fspan>\n<div style=\"background:#2b2926;color:#fff;border-radius:5px;padding:8px 11px;font:600 11px system-ui\">Live<\u002Fdiv><span style=\"color:#a5a098\">⇄<\u002Fspan>\n<div style=\"background:#f0ede8;border:1px solid #d5d2cc;border-radius:5px;padding:8px 11px;font:600 11px system-ui;color:#6b6660\">Paused<\u002Fdiv><span style=\"color:#a5a098\">→<\u002Fspan>\n<div style=\"border:1px solid #d5d2cc;border-radius:5px;padding:8px 11px;font:600 11px system-ui;color:#a5a098;text-decoration:line-through\">Retired<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:16px;display:flex;flex-direction:column;gap:9px\">\n<div style=\"display:flex;gap:12px;font:11.5px/1.5 system-ui;color:#4a4743\"><span style=\"flex:none;width:66px;font:700 10px ui-monospace,monospace;color:#8f8a82;padding-top:2px\">DRAFT<\u002Fspan><span><b>Derived.<\u002Fb> <span style=\"font:11px ui-monospace,monospace\">status=inactive<\u002Fspan>, never activated, readiness fails. Only reachable place for a half-built character.<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;gap:12px;font:11.5px/1.5 system-ui;color:#4a4743\"><span style=\"flex:none;width:66px;font:700 10px ui-monospace,monospace;color:#8f8a82;padding-top:2px\">READY<\u002Fspan><span><b>Derived.<\u002Fb> <span style=\"font:11px ui-monospace,monospace\">status=inactive<\u002Fspan> and all readiness rules pass. The Activate button becomes enabled — this is the only difference the operator sees.<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;gap:12px;font:11.5px/1.5 system-ui;color:#4a4743\"><span style=\"flex:none;width:66px;font:700 10px ui-monospace,monospace;color:#8f8a82;padding-top:2px\">LIVE<\u002Fspan><span><b>Stored:<\u002Fb> <span style=\"font:11px ui-monospace,monospace\">status='active'<\u002Fspan>. Exactly what <span style=\"font:11px ui-monospace,monospace\">GET /api/characters<\u002Fspan> returns today. No schema change.<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;gap:12px;font:11.5px/1.5 system-ui;color:#4a4743\"><span style=\"flex:none;width:66px;font:700 10px ui-monospace,monospace;color:#8f8a82;padding-top:2px\">PAUSED<\u002Fspan><span><b>Derived.<\u002Fb> <span style=\"font:11px ui-monospace,monospace\">status='inactive'<\u002Fspan> <i>after<\u002Fi> having been live. Distinguished from Draft by history, not by a new column — matters because pausing is reversible in one click and drafting is not.<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;gap:12px;font:11.5px/1.5 system-ui;color:#4a4743\"><span style=\"flex:none;width:66px;font:700 10px ui-monospace,monospace;color:#8f8a82;padding-top:2px\">RETIRED<\u002Fspan><span><b>Needs one new value.<\u002Fb> Permanently withdrawn, hidden from the default catalogue, records intact. The only schema addition I'd ask for. <span style=\"color:#8f8a82\">Deferrable past the PoC.<\u002Fspan><\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:16px;padding:12px;background:#faf9f6;border:1px solid #dcd9d3;border-radius:6px;font:11.5px/1.6 system-ui;color:#4a4743\"><b style=\"color:#2b2926\">\"Review\" is deliberately not a character state.<\u002Fb> The brief's <i>Inactive → Ready for Review → Ready to Publish → Active<\u002Fi> assumes a two-person approval chain. Review in this product happens on <b>media assets<\u002Fb>, not on characters. Adding a character review state would force operators to advance a workflow that has no second actor. If a second role (approver) is ever introduced, insert it here — see Open Decision <b>OD-2<\u002Fb>.<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"flex:1;min-width:520px;background:#fff;border:1px solid #d5d2cc;border-radius:8px;padding:20px\">\n<div style=\"font:700 12px system-ui;color:#1f1d1b\">Media lifecycle — stored states already exist in the schema<\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:16px 0 4px\">\n<div style=\"border:1px solid #d5d2cc;border-radius:5px;padding:8px 11px;font:600 11px system-ui;color:#6b6660\">Generated<br><span style=\"font:9px ui-monospace,monospace;color:#a5a098\">or Uploaded<\u002Fspan><\u002Fdiv><span style=\"color:#a5a098\">→<\u002Fspan>\n<div style=\"border:1px dashed #2b2926;border-radius:5px;padding:8px 11px;font:600 11px system-ui;color:#2b2926\">Under review<\u002Fdiv><span style=\"color:#a5a098\">→<\u002Fspan>\n<div style=\"border:1px solid #2b2926;border-radius:5px;padding:8px 11px;font:600 11px system-ui;color:#2b2926\">Approved<\u002Fdiv><span style=\"color:#a5a098\">→<\u002Fspan>\n<div style=\"background:#2b2926;color:#fff;border-radius:5px;padding:8px 11px;font:600 11px system-ui\">Published<br><span style=\"font:9px ui-monospace,monospace;opacity:.7\">derived<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;gap:10px;margin-top:10px\"><span style=\"font:10px ui-monospace,monospace;color:#a5a098;padding-top:9px\">off-ramps →<\u002Fspan>\n<div style=\"border:1px solid #d5d2cc;border-radius:5px;padding:7px 10px;font:600 11px system-ui;color:#8f8a82\">Rejected<\u002Fdiv>\n<div style=\"border:1px solid #d5d2cc;border-radius:5px;padding:7px 10px;font:600 11px system-ui;color:#8f8a82;text-decoration:line-through\">Retired<\u002Fdiv><\u002Fdiv>\n<div style=\"margin-top:16px;padding:12px;background:#faf9f6;border:1px solid #2b2926;border-radius:6px;font:11.5px/1.6 system-ui;color:#3a3835\">\n<div style=\"font:700 10px ui-monospace,monospace;letter-spacing:.07em;color:#2b2926\">THE APPROVED / PUBLISHED DISTINCTION — READ FROM THE CODE<\u002Fdiv>\n<p style=\"margin:8px 0 0\">An asset is <b>Published<\u002Fb> if and only if all four hold:<\u002Fp>\n<div style=\"margin-top:7px;font:11px/1.9 ui-monospace,Menlo,monospace;color:#2b2926\">kind = 'reference'<br>status = 'approved'<br>is_canonical = true<br>visual_identity_id = the character's ACTIVE identity<br><span style=\"color:#8f8a82\">…and the character is Live<\u002Fspan><\u002Fdiv>\n<p style=\"margin:9px 0 0\">That is precisely what the public visual-identity endpoint projects. So an approved generated video is <b>approved but never published<\u002Fb> — correct, and today invisible. The UI states this in words on every asset instead of making the operator infer it.<\u002Fp>\n<\u002Fdiv>\n<div style=\"margin-top:14px;display:flex;flex-direction:column;gap:8px\">\n<div style=\"font:11.5px/1.5 system-ui;color:#4a4743\"><b>Retired<\u002Fb> is the one media addition needed: withdraw an approved asset without rejecting it (rejection implies \"bad\", retirement implies \"superseded\"). Can be modelled as <span style=\"font:11px ui-monospace,monospace\">is_canonical=false<\u002Fspan> + a retired flag.<\u002Fdiv>\n<div style=\"font:11.5px/1.5 system-ui;color:#4a4743\"><b>Generated media never auto-promotes.<\u002Fb> Reaching Primary requires an explicit approve action that stamps <span style=\"font:11px ui-monospace,monospace\">approved_by / approved_at<\u002Fspan> — already true in the schema; the UI must not offer a shortcut around it.<\u002Fdiv>\n<div style=\"font:11.5px/1.5 system-ui;color:#4a4743\"><b>Content rating<\u002Fb> (<span style=\"font:11px ui-monospace,monospace\">sfw | explicit<\u002Fspan>) is orthogonal to status and always rendered as a separate red bar, never merged into the status badge.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"padding:40px 44px 34px;border-bottom:1px solid rgba(0,0,0,.08);max-width:1300px\" id=\"ia\">\n<div style=\"font:700 10px ui-monospace,Menlo,monospace;letter-spacing:.09em;color:#8f8a82\">PART A · US-103<\u002Fdiv>\n<h2 style=\"font:700 22px system-ui;color:#1a1a1a;margin:8px 0 6px\">Recommended information architecture<\u002Fh2>\n<p style=\"max-width:760px;font:13px/1.65 system-ui;color:#4a4743;margin:0 0 22px\">The brief proposes Characters → All / Active / Inactive / Needs Attention as four nav items. At 5–20 characters that is four destinations that all render the same table. I recommend <b>five top-level areas, with state as filters<\u002Fb>, and Needs Attention promoted to a signal that appears in three places rather than a page you must remember to visit.<\u002Fp>\n\n<div style=\"display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start\">\n<div style=\"background:#fff;border:1px solid #d5d2cc;border-radius:8px;padding:20px;min-width:420px\">\n<div style=\"font:700 12px system-ui;color:#1f1d1b;margin-bottom:12px\">Recommended<\u002Fdiv>\n<div style=\"font:12px/2 ui-monospace,Menlo,monospace;color:#3a3835;white-space:pre\">/admin\n├── <b>Today<\u002Fb>            operational overview · landing\n├── <b>Characters<\u002Fb>       catalogue\n│     └── Character Detail  ← the operational home\n│           Overview · Persona · Visual Identity\n│           Media · Publishing · History\n├── <b>Media Library<\u002Fb>    every asset, every character\n│     └── Media Detail      side drawer, not a page\n├── <b>Review Queue<\u002Fb> <span style=\"background:#2b2926;color:#fff;padding:0 5px;border-radius:7px\">7<\u002Fspan>  one job: decide\n└── <b>Activity<\u002Fb>         who changed what, when<\u002Fdiv>\n<div style=\"margin-top:16px;padding-top:14px;border-top:1px solid #dcd9d3;font:11.5px/1.6 system-ui;color:#4a4743\">\n<div style=\"margin-bottom:7px\"><b>Characters vs Media is the top-level split<\u002Fb> — the two nav items are adjacent and never nest inside each other. Character Detail's Media tab is a <i>filtered view of the same library<\u002Fi>, not a second system.<\u002Fdiv>\n<div style=\"margin-bottom:7px\"><b>Review Queue is separate from Media Library<\u002Fb> even though it shows media. Different job: the library is for finding, the queue is for deciding, and it empties. A count badge in the sidebar is the epic's \"what needs attention\" answer at zero cost.<\u002Fdiv>\n<div><b>Activity<\u002Fb> replaces the developer's git log. It is how an operator answers \"who deactivated Maria?\" without a database.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"background:#fff;border:1px solid #d5d2cc;border-radius:8px;padding:20px;min-width:420px;flex:1\">\n<div style=\"font:700 12px system-ui;color:#1f1d1b;margin-bottom:12px\">Changes from the brief, and why<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:12px\">\n<div style=\"font:11.5px/1.6 system-ui;color:#4a4743\"><span style=\"font:10px ui-monospace,monospace;color:#8f8a82\">DROPPED<\u002Fspan><br><b>Active / Inactive / Needs Attention as nav items.<\u002Fb> They become persistent filter chips on the catalogue with counts. Same information, one destination, and the counts are visible without navigating.<\u002Fdiv>\n<div style=\"font:11.5px/1.6 system-ui;color:#4a4743\"><span style=\"font:10px ui-monospace,monospace;color:#8f8a82\">RENAMED<\u002Fspan><br><b>Dashboard → Today.<\u002Fb> Signals \"operational state right now\", discourages it drifting into a charts page.<\u002Fdiv>\n<div style=\"font:11.5px/1.6 system-ui;color:#4a4743\"><span style=\"font:10px ui-monospace,monospace;color:#8f8a82\">ADDED<\u002Fspan><br><b>Activity.<\u002Fb> Not in the brief but required by the epic's premise: replacing a deploy pipeline means replacing its audit trail too.<\u002Fdiv>\n<div style=\"font:11.5px/1.6 system-ui;color:#4a4743\"><span style=\"font:10px ui-monospace,monospace;color:#8f8a82\">DEMOTED<\u002Fspan><br><b>Media Detail is a drawer, not a route.<\u002Fb> Review is a rapid sequence of decisions; a full page navigation per asset destroys the rhythm and loses grid scroll position. It keeps a deep-linkable URL.<\u002Fdiv>\n<div style=\"font:11.5px/1.6 system-ui;color:#4a4743\"><span style=\"font:10px ui-monospace,monospace;color:#8f8a82\">SCOPED<\u002Fspan><br><b>Needs Attention lives in all three places<\u002Fb> the brief asks about — a Today block (triage), a catalogue filter chip + per-row flag (browse), and a banner on Character Detail (in context). One rules engine, three renderings.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"margin-top:24px;background:#fff;border:1px solid #d5d2cc;border-radius:8px;padding:20px;max-width:1300px\">\n<div style=\"font:700 12px system-ui;color:#1f1d1b\">Where the admin lives, relative to the existing app<\u002Fdiv>\n<p style=\"font:11.5px/1.65 system-ui;color:#4a4743;margin:9px 0 0;max-width:900px\">The consumer app is a mobile-first shell (<span style=\"font:11px ui-monospace,monospace\">max-w-lg<\u002Fspan>, zinc-950 / rose-500, three bottom-nav destinations). The admin is a <b>separate desktop route tree at <span style=\"font:11px ui-monospace,monospace\">/admin<\u002Fspan><\u002Fb> with its own sidebar shell — it must not inherit the mobile bottom nav or the 512px column. It <i>does<\u002Fi> inherit the existing type scale, radii, zinc surfaces and rose accent, so it reads as the same product's back office. Wireframes here are greyscale on purpose; the applied theme is the dark zinc surface used by <span style=\"font:11px ui-monospace,monospace\">AppShell.tsx<\u002Fspan>, with rose reserved for destructive and explicit-content signalling only.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"padding:40px 44px 34px;border-bottom:1px solid rgba(0,0,0,.08);max-width:1300px\" id=\"flow\">\n<div style=\"font:700 10px ui-monospace,Menlo,monospace;letter-spacing:.09em;color:#8f8a82\">PART B<\u002Fdiv>\n<h2 style=\"font:700 22px system-ui;color:#1a1a1a;margin:8px 0 6px\">End-to-end user flow<\u002Fh2>\n<div style=\"background:#fff;border:1px solid #d5d2cc;border-radius:8px;padding:22px;overflow-x:auto\">\n<div style=\"font:11.5px/1.95 ui-monospace,Menlo,monospace;color:#3a3835;white-space:pre\">TODAY  <span style=\"color:#8f8a82\">(landing — triage, never analytics)<\u002Fspan>\n  │\n  ├─ \"2 characters need attention\" ──────────────┐\n  ├─ \"7 assets awaiting review\" ─────────┐       │\n  │                                      │       │\n  ├─ CHARACTERS <span style=\"color:#8f8a82\">[W02]<\u002Fspan>                     │       │\n  │    │  filters: All · Live · Paused · Draft · ⚠ Needs attention <span style=\"color:#8f8a82\">←──────┘<\u002Fspan>\n  │    │\n  │    ├─ + CREATE CHARACTER  <span style=\"color:#8f8a82\">wizard, creates a DRAFT on step 1<\u002Fspan>\n  │    │     1 Basics <span style=\"color:#8f8a82\">[W03]<\u002Fspan> → 2 Persona → 3 Visual Identity <span style=\"color:#8f8a82\">[W04]<\u002Fspan>\n  │    │       → 4 Reference assets <span style=\"color:#8f8a82\">[W05]<\u002Fspan> → 5 Review <span style=\"color:#8f8a82\">[W06]<\u002Fspan>\n  │    │            │                                    │\n  │    │            └─ \"Save &amp; finish later\" ────────────┤\n  │    │                                                 ▼\n  │    └─ CHARACTER DETAIL <span style=\"color:#8f8a82\">[W07] ← the operational home<\u002Fspan>\n  │           ├─ Overview      what users see right now\n  │           ├─ Persona       edit profile / conversation style\n  │           ├─ Visual Identity <span style=\"color:#8f8a82\">[W08]<\u002Fspan>  versions · Visual DNA · primary set\n  │           │      └─ New version → draft → <b>Activate version<\u002Fb> ⚠ confirm\n  │           ├─ Media <span style=\"color:#8f8a82\">[W09]<\u002Fspan>   filtered Media Library, scoped to character\n  │           │      └─ MEDIA DETAIL drawer <span style=\"color:#8f8a82\">[W11]<\u002Fspan> ─┐\n  │           ├─ Publishing <span style=\"color:#8f8a82\">[W13]<\u002Fspan>  readiness → <b>Activate<\u002Fb> / <b>Deactivate<\u002Fb> ⚠ <span style=\"color:#8f8a82\">[W15]<\u002Fspan>\n  │           └─ History      audit trail for this character\n  │                                                      │\n  ├─ MEDIA LIBRARY <span style=\"color:#8f8a82\">[W10]<\u002Fspan> ────────────────────────────┤\n  │     grid · filters: character · type · origin · state · rating\n  │     └─ MEDIA DETAIL drawer <span style=\"color:#8f8a82\">[W11]<\u002Fspan> ←───────────────┘\n  │           actions: Approve · Reject · Make primary · Retire · Replace\n  │\n  ├─ REVIEW QUEUE <span style=\"color:#8f8a82\">[W12]<\u002Fspan> ←──────────────────────────┘\n  │     one asset at a time · keyboard A/R/S · ends empty\n  │\n  └─ ACTIVITY   who changed what, when — replaces the git log<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;gap:20px;flex-wrap:wrap;margin-top:18px\">\n<div style=\"flex:1;min-width:340px;background:#fff;border:1px solid #d5d2cc;border-radius:8px;padding:16px;font:11.5px/1.6 system-ui;color:#4a4743\"><b style=\"color:#2b2926\">Every loop closes on Character Detail.<\u002Fb> Approving an asset from the queue offers \"back to queue\" (default) and \"open Maria\". Finishing the wizard lands on Detail, not on the catalogue. Reactivating from the catalogue opens Detail's Publishing tab. There is no dead end where the operator must re-navigate from the sidebar.<\u002Fdiv>\n<div style=\"flex:1;min-width:340px;background:#fff;border:1px solid #d5d2cc;border-radius:8px;padding:16px;font:11.5px/1.6 system-ui;color:#4a4743\"><b style=\"color:#2b2926\">Two irreversible-feeling actions get confirmation:<\u002Fb> character deactivation <span style=\"font:11px ui-monospace,monospace\">[W15]<\u002Fspan> and activating a different identity version (it changes what every future generation looks like). Approving, rejecting and retiring media are all reversible and use an inline undo toast instead of a modal — modals on a review queue destroy throughput.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<section style=\"padding:40px 44px 34px;border-bottom:1px solid rgba(0,0,0,.08)\" id=\"wireframes\">\n<div style=\"font:700 10px ui-monospace,Menlo,monospace;letter-spacing:.09em;color:#8f8a82\">PART C + D<\u002Fdiv>\n<h2 style=\"font:700 22px system-ui;color:#1a1a1a;margin:8px 0 6px\">Wireframes W01–W16, with condensed spec<\u002Fh2>\n<p style=\"max-width:780px;font:13px/1.65 system-ui;color:#4a4743;margin:0 0 26px\">Each screen carries a spec strip: <b>purpose · entry · primary action · must-see · states<\u002Fb>. Drawn at desktop 1180px. Greyscale is deliberate — structure and hierarchy first, product theme applied at build time.<\u002Fp>\n\n<div style=\"display:flex;flex-direction:column;gap:34px\">\n\n<!-- ══ W01 ══ -->\n<div id=\"W01\" style=\"scroll-margin-top:16px\">\n<div style=\"display:flex;align-items:baseline;gap:10px;margin-bottom:9px\"><span style=\"font:700 10.5px ui-monospace,monospace;background:#1a1a1a;color:#fff;padding:3px 7px;border-radius:4px\">W01<\u002Fspan><span style=\"font:600 13px system-ui;color:#1a1a1a\">Today — admin landing<\u002Fspan><\u002Fdiv>\n<div style=\"width:1180px;background:#fff;border:1px solid #d5d2cc;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.06);overflow:hidden\">\n<div style=\"display:flex;height:44px;align-items:center;gap:14px;padding:0 16px;background:#f6f4f0;border-bottom:1px solid #dcd9d3\"><span style=\"font:700 12px system-ui;color:#2b2926\">Over<span style=\"color:#e11d48\">18<\u002Fspan> Admin<\u002Fspan><span style=\"margin-left:auto;font:10px ui-monospace,monospace;color:#8f8a82\">operator@over18<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex\">\n<div style=\"width:158px;flex:none;background:#faf9f6;border-right:1px solid #dcd9d3;padding:14px 10px;display:flex;flex-direction:column;gap:3px;min-height:430px\">\n<div style=\"font:600 11px system-ui;color:#2b2926;padding:6px 8px;border-radius:4px;background:#e8e5e0\">Today<\u002Fdiv>\n<div style=\"font:11px system-ui;color:#6b6660;padding:6px 8px\">Characters<\u002Fdiv>\n<div style=\"font:11px system-ui;color:#6b6660;padding:6px 8px\">Media Library<\u002Fdiv>\n<div style=\"font:11px system-ui;color:#6b6660;padding:6px 8px;display:flex;justify-content:space-between\">Review Queue<span style=\"background:#2b2926;color:#fff;font:700 9px ui-monospace,monospace;padding:1px 5px;border-radius:8px\">7<\u002Fspan><\u002Fdiv>\n<div style=\"font:11px system-ui;color:#6b6660;padding:6px 8px\">Activity<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:1;padding:20px 22px 24px\">\n<div style=\"display:flex;align-items:center\"><div><div style=\"font:700 18px system-ui;color:#1f1d1b\">Today<\u002Fdiv><div style=\"font:11px ui-monospace,monospace;color:#8f8a82;margin-top:3px\">Friday 15 August · catalogue healthy<\u002Fdiv><\u002Fdiv><div style=\"margin-left:auto;background:#2b2926;color:#fff;font:600 11px system-ui;padding:8px 13px;border-radius:5px\">+ New character<\u002Fdiv><\u002Fdiv>\n\n<div style=\"margin-top:18
