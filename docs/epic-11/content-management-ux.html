 5px;border-radius:3px\">2 ◆<\u002Fspan><\u002Fdiv><div style=\"font:10px system-ui;color:#8f8a82;margin-top:9px\">updated 3w ago<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n\n<div style=\"border:1px solid #2b2926;border-radius:7px;overflow:hidden\"><div style=\"height:150px;background:#efece7;position:relative;display:flex;align-items:center;justify-content:center;font:9px ui-monospace,monospace;color:#948e86\">primary ref<span style=\"position:absolute;top:8px;left:8px;background:#f0ede8;border:1px solid #b6b1a9;color:#5f5b55;font:700 8px ui-monospace,monospace;padding:1px 5px;border-radius:3px\">PAUSED<\u002Fspan><\u002Fdiv><div style=\"padding:11px\"><div style=\"font:600 13px system-ui;color:#1f1d1b\">Ember<\u002Fdiv><div style=\"font:10px ui-monospace,monospace;color:#8f8a82;margin-top:3px\">identity v1 active · v2 draft<\u002Fdiv><div style=\"margin-top:9px;font:10.5px system-ui;color:#2b2926;display:flex;gap:5px\"><span>⚠<\u002Fspan>v2 incomplete<\u002Fdiv><div style=\"font:10px system-ui;color:#8f8a82;margin-top:8px\">paused 2d ago<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n\n<div style=\"border:1px solid #2b2926;border-radius:7px;overflow:hidden\"><div style=\"height:150px;background:#f4f2ee;position:relative;display:flex;align-items:center;justify-content:center;font:9px ui-monospace,monospace;color:#a5a098;border-bottom:1px dashed #cbc7c0\">no primary ref<span style=\"position:absolute;top:8px;left:8px;border:1px dashed #8f8a82;background:#fff;color:#3a3835;font:700 8px ui-monospace,monospace;padding:1px 5px;border-radius:3px\">DRAFT<\u002Fspan><\u002Fdiv><div style=\"padding:11px\"><div style=\"font:600 13px system-ui;color:#1f1d1b\">Luna<\u002Fdiv><div style=\"font:10px ui-monospace,monospace;color:#8f8a82;margin-top:3px\">identity v1 draft · 1 asset<\u002Fdiv><div style=\"margin-top:9px;font:10.5px system-ui;color:#2b2926;display:flex;gap:5px\"><span>⚠<\u002Fspan>No primary reference<\u002Fdiv><div style=\"font:10px system-ui;color:#8f8a82;margin-top:8px\">created 1d ago<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n\n<\u002Fdiv>\n<div style=\"margin-top:14px;padding:11px 13px;border:1px dashed #cbc7c0;border-radius:6px;font:11px/1.55 system-ui;color:#6b6660\"><b style=\"color:#2b2926\">Fields deliberately NOT on the card:<\u002Fb> approved/pending counts as raw numbers for every state, publication date, provider, model, video counts. They are one click away on Detail. The card answers only: who, live or not, is anything wrong, and when did it last change.<\u002Fdiv>\n<\u002Fdiv><\u002Fdiv>\n<div style=\"border-top:1px solid #dcd9d3;background:#faf9f6;padding:12px 16px;display:grid;grid-template-columns:repeat(5,1fr);gap:16px;font:11px/1.55 system-ui;color:#4a4743\">\n<div><b style=\"color:#2b2926\">Purpose<\u002Fb><br>State of every character at a glance; route into Detail.<\u002Fdiv>\n<div><b style=\"color:#2b2926\">Entry<\u002Fb><br>Sidebar; Today counts; post-wizard.<\u002Fdiv>\n<div><b style=\"color:#2b2926\">Primary action<\u002Fb><br>Open a character. Secondary: new character, filter, search, switch to list view.<\u002Fdiv>\n<div><b style=\"color:#2b2926\">Must see<\u002Fb><br>Face, name, live-or-not, warning flag. Attention cards get a dark border — visible even when scanning peripherally.<\u002Fdiv>\n<div><b style=\"color:#2b2926\">States<\u002Fb><br>Empty first-run (illustrated CTA); filter-empty (\"No paused characters\" + clear filter); loading = 8 skeleton cards; missing image → initial-letter tile, never a broken image (matches <span style=\"font:10px ui-monospace,monospace\">CharacterCard.tsx<\u002Fspan> behaviour); error = retry banner, filters stay usable.<\u002Fdiv>\n<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ══ W03–W06 wizard ══ -->\n<div id=\"W03\" style=\"scroll-margin-top:16px\">\n<div style=\"display:flex;align-items:baseline;gap:10px;margin-bottom:9px\"><span style=\"font:700 10.5px ui-monospace,monospace;background:#1a1a1a;color:#fff;padding:3px 7px;border-radius:4px\">W03<\u002Fspan><span style=\"font:600 13px system-ui;color:#1a1a1a\">Create character — Step 1, Basics<\u002Fspan><\u002Fdiv>\n<div style=\"width:1180px;background:#fff;border:1px solid #d5d2cc;border-radius:8px;padding:20px 22px 0;box-shadow:0 1px 3px rgba(0,0,0,.06);overflow:hidden\">\n<div style=\"padding:12px 14px;background:#faf9f6;border:1px solid #dcd9d3;border-radius:7px;font:11.5px/1.6 system-ui;color:#4a4743;margin-bottom:18px\"><b style=\"color:#2b2926\">Pattern decision: a guided wizard that creates a Draft on step 1 — not a single page, not a modal form.<\u002Fb> Three reasons, all structural rather than stylistic. (1) <b>The data has a hard dependency order<\u002Fb>: an identity version needs a character row, and a visual asset needs an identity version (<span style=\"font:11px ui-monospace,monospace\">visual_identity_id NOT NULL<\u002Fspan>). A single page would have to fake that ordering or defer all writes to one giant submit. (2) <b>Onboarding is interruptible<\u002Fb> — sourcing reference imagery takes days; \"Save &amp; finish later\" must be a first-class exit at every step, which means real persistence, which means a Draft. (3) <b>It makes accidental publishing structurally impossible<\u002Fb>: the wizard has no activate action until step 5, and step 5's button is gated by the same readiness rules as Detail — one rules engine, not two. Steps 2–4 are skippable; only step 1 is mandatory.<\u002Fdiv>\n<div style=\"display:flex;gap:0;align-items:center;margin-bottom:18px\">\n<div style=\"flex:1;display:flex;align-items:center;gap:8px\"><span style=\"width:22px;height:22px;border-radius:11px;background:#2b2926;color:#fff;font:700 10px ui-monospace,monospace;display:flex;align-items:center;justify-content:center\">1<\u002Fspan><span style=\"font:600 11.5px system-ui;color:#1f1d1b\">Basics<\u002Fspan><span style=\"flex:1;height:1px;background:#dcd9d3\"><\u002Fspan><\u002Fdiv>\n<div style=\"flex:1;display:flex;align-items:center;gap:8px\"><span style=\"width:22px;height:22px;border-radius:11px;border:1px solid #cbc7c0;color:#8f8a82;font:700 10px ui-monospace,monospace;display:flex;align-items:center;justify-content:center\">2<\u002Fspan><span style=\"font:11.5px system-ui;color:#7d7871\">Persona<\u002Fspan><span style=\"flex:1;height:1px;background:#dcd9d3\"><\u002Fspan><\u002Fdiv>\n<div style=\"flex:1;display:flex;align-items:center;gap:8px\"><span style=\"width:22px;height:22px;border-radius:11px;border:1px solid #cbc7c0;color:#8f8a82;font:700 10px ui-monospace,monospace;display:flex;align-items:center;justify-content:center\">3<\u002Fspan><span style=\"font:11.5px system-ui;color:#7d7871\">Visual Identity<\u002Fspan><span style=\"flex:1;height:1px;background:#dcd9d3\"><\u002Fspan><\u002Fdiv>\n<div style=\"flex:1;display:flex;align-items:center;gap:8px\"><span style=\"width:22px;height:22px;border-radius:11px;border:1px solid #cbc7c0;color:#8f8a82;font:700 10px ui-monospace,monospace;display:flex;align-items:center;justify-content:center\">4<\u002Fspan><span style=\"font:11.5px system-ui;color:#7d7871\">Reference assets<\u002Fspan><span style=\"flex:1;height:1px;background:#dcd9d3\"><\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:22px;height:22px;border-radius:11px;border:1px solid #cbc7c0;color:#8f8a82;font:700 10px ui-monospace,monospace;display:flex;align-items:center;justify-content:center\">5<\u002Fspan><span style=\"font:11.5px system-ui;color:#7d7871\">Review<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;gap:22px;padding-bottom:20px\">\n<div style=\"flex:1\">\n<div style=\"font:700 15px system-ui;color:#1f1d1b\">Who is this character?<\u002Fdiv>\n<div style=\"font:11.5px system-ui;color:#7d7871;margin-top:4px\">Saved as a draft the moment you continue. Nothing is visible to users until you activate her.<\u002Fdiv>\n<div style=\"margin-top:16px;display:flex;flex-direction:column;gap:13px\">\n<div><div style=\"font:600 11px system-ui;color:#3a3835;margin-bottom:5px\">Display name <span style=\"color:#e11d48\">*<\u002Fspan><\u002Fdiv><div style=\"border:1px solid #b6b1a9;border-radius:5px;padding:9px 11px;font:12px system-ui;color:#1f1d1b\">Luna<\u002Fdiv><\u002Fdiv>\n<div><div style=\"font:600 11px system-ui;color:#3a3835;margin-bottom:5px\">Handle <span style=\"font:10px ui-monospace,monospace;color:#8f8a82\">— unique, lowercase, permanent<\u002Fspan><\u002Fdiv><div style=\"border:1px solid #cbc7c0;border-radius:5px;padding:9px 11px;font:12px ui-monospace,monospace;color:#6b6660\">luna <span style=\"color:#2b2926;float:right;font:10px system-ui\">✓ available<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div><div style=\"font:600 11px system-ui;color:#3a3835;margin-bottom:5px\">Short bio <span style=\"color:#e11d48\">*<\u002Fspan> <span style=\"font:10px ui-monospace,monospace;color:#8f8a82\">— shown on the discover card<\u002Fspan><\u002Fdiv><div style=\"border:1px solid #cbc7c0;border-radius:5px;padding:9px 11px;height:52px\"><div style=\"height:6px;width:78%;background:#dedbd5;border-radius:3px\"><\u002Fdiv><div style=\"height:6px;width:52%;background:#dedbd5;border-radius:3px;margin-top:7px\"><\u002Fdiv><\u002Fdiv><div style=\"font:10px ui-monospace,monospace;color:#8f8a82;margin-top:4px\">96 / 160<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"width:300px;flex:none\">\n<div style=\"font:700 9px ui-monospace,monospace;color:#8f8a82;letter-spacing:.07em\">LIVE PREVIEW — DISCOVER CARD<\u002Fdiv>\n<div style=\"margin-top:9px;width:170px;border:1px solid #dcd9d3;border-radius:10px;overflow:hidden;background:#faf9f6\"><div style=\"height:200px;background:#e4e1db;display:flex;align-items:center;justify-content:center;font:9px ui-monospace,monospace;color:#a5a098\">no image yet<\u002Fdiv><div style=\"padding:10px\"><div style=\"font:600 12px system-ui;color:#1f1d1b\">Luna<\u002Fdiv><div style=\"height:5px;width:80%;background:#dedbd5;border-radius:3px;margin-top:6px\"><\u002Fdiv><div style=\"height:5px;width:55%;background:#dedbd5;border-radius:3px;margin-top:5px\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"font:11px/1.5 system-ui;color:#7d7871;margin-top:10px\">The preview mirrors the real consumer card, so the operator sees the consequence of their copy without deploying anything.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin:0 -22px;border-top:1px solid #dcd9d3;background:#faf9f6;padding:12px 22px;display:flex;align-items:center\"><div style=\"font:11px system-ui;color:#7d7871\">Draft saved automatically · <span style=\"color:#2a78d6\">Save &amp; finish later<\u002Fspan><\u002Fdiv><div style=\"margin-left:auto;display:flex;gap:8px\"><div style=\"background:#fff;border:1px solid #cbc7c0;color:#3a3835;font:600 11px system-ui;padding:7px 13px;border-radius:5px\">Cancel<\u002Fdiv><div style=\"background:#2b2926;color:#fff;font:600 11px system-ui;padding:8px 15px;border-radius:5px\">Continue →<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"margin:0 -22px;border-top:1px solid #dcd9d3;background:#f3f1ec;padding:12px 22px;display:grid;grid-template-columns:repeat(5,1fr);gap:16px;font:11px/1.55 system-ui;color:#4a4743\">\n<div><b style=\"color:#2b2926\">Purpose<\u002Fb><br>Create the character row; nothing more.<\u002Fdiv>\n<div><b style=\"color:#2b2926\">Entry<\u002Fb><br>Today CTA; catalogue CTA; empty state.<\u002Fdiv>\n<div><b style=\"color:#2b2926\">Primary action<\u002Fb><br>Continue (creates the Draft).<\u002Fdiv>\n<div><b style=\"color:#2b2926\">Must see<\u002Fb><br>That this is a draft and users can't see it.<\u002Fdiv>\n<div><b style=\"color:#2b2926\">States<\u002Fb><br>Handle taken (inline, blocking); required-field errors on continue not on blur; save-in-flight disables Continue; cancel with unsaved input → \"discard draft?\" confirm.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"W04\" style=\"scroll-margin-top:16px\">\n<div style=\"display:flex;align-items:baseline;gap:10px;margin-bottom:9px\"><span style=\"font:700 10.5px ui-monospace,monospace;background:#1a1a1a;color:#fff;padding:3px 7px;border-radius:4px\">W04<\u002Fspan><span style=\"font:600 13px system-ui;color:#1a1a1a\">Create character — Step 3, Visual Identity<\u002Fspan><\u002Fdiv>\n<div style=\"width:1180px;background:#fff;border:1px solid #d5d2cc;border-radius:8px;padding:20px 22px 0;box-shadow:0 1px 3px rgba(0,0,0,.06);overflow:hidden\">\n<div style=\"display:flex;gap:8px;align-items:center;margin-bottom:16px;font:11.5px system-ui;color:#7d7871\"><span style=\"color:#2b2926\">✓ Basics<\u002Fspan> → <span style=\"color:#2b2926\">✓ Persona<\u002Fspan> → <b style=\"color:#1f1d1b\">Visual Identity<\u002Fb> → Reference assets → Review<\u002Fdiv>\n<div style=\"display:flex;gap:22px;padding-bottom:20px\">\n<div style=\"flex:1\">\n<div style=\"font:700 15px system-ui;color:#1f1d1b\">What does Luna look like?<\u002Fdiv>\n<div style=\"font:11.5px/1.6 system-ui;color:#7d7871;margin-top:4px;max-width:560px\">This is her <b>Visual DNA<\u002Fb> — identity only. Clothing, pose, lighting and scene are decided per-generation and never stored here, so her face stays consistent across every image and video. Saved as <b>identity v1 (draft)<\u002Fb>.<\u002Fdiv>\n<div style=\"margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px\">\n<div><div style=\"font:600 11px system-ui;color:#3a3835;margin-bottom:5px\">Apparent age band <span style=\"color:#e11d48\">*<\u002Fspan><\u002Fdiv><div style=\"border:1px solid #b6b1a9;border-radius:5px;padding:9px 11px;font:12px system-ui\">adult (mid-20s) ▾<\u002Fdiv><div style=\"font:10px system-ui;color:#8f8a82;margin-top:4px\">Must denote an adult. Non-adult values are rejected.<\u002Fdiv><\u002Fdiv>\n<div><div style=\"font:600 11px system-ui;color:#3a3835;margin-bottom:5px\">Version label<\u002Fdiv><div style=\"border:1px solid #cbc7c0;border-radius:5px;padding:9px 11px;font:12px system-ui;color:#8f8a82\">e.g. \"launch look\"<\u002Fdiv><\u002Fdiv>\n<div><div style=\"font:600 11px system-ui;color:#3a3835;margin-bottom:5px\">Face<\u002Fdiv><div style=\"border:1px solid #cbc7c0;border-radius:5px;padding:9px 11px;height:38px\"><div style=\"height:6px;width:70%;background:#dedbd5;border-radius:3px\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div><div style=\"font:600 11px system-ui;color:#3a3835;margin-bottom:5px\">Eyes<\u002Fdiv><div style=\"border:1px solid #cbc7c0;border-radius:5px;padding:9px 11px;height:38px\"><div style=\"height:6px;width:55%;background:#dedbd5;border-radius:3px\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div><div style=\"font:600 11px system-ui;color:#3a3835;margin-bottom:5px\">Hair<\u002Fdiv><div style=\"border:1px solid #cbc7c0;border-radius:5px;padding:9px 11px;height:38px\"><div style=\"height:6px;width:64%;background:#dedbd5;border-radius:3px\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div><div style=\"font:600 11px system-ui;color:#3a3835;margin-bottom:5px\">Skin<\u002Fdiv><div style=\"border:1px solid #cbc7c0;border-radius:5px;padding:9px 11px;height:38px\"><\u002Fdiv><\u002Fdiv>\n<div><div style=\"font:600 11px system-ui;color:#3a3835;margin-bottom:5px\">Body<\u002Fdiv><div style=\"border:1px solid #cbc7c0;border-radius:5px;padding:9px 11px;height:38px\"><\u002Fdiv><\u002Fdiv>\n<div><div style=\"font:600 11px system-ui;color:#3a3835;margin-bottom:5px\">Distinctive features<\u002Fdiv><div style=\"border:1px solid #cbc7c0;border-radius:5px;padding:9px 11px;height:38px\"><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:12px;font:11px system-ui;color:#2a78d6\">+ Add another identity attribute<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"width:290px;flex:none\">\n<div style=\"padding:12px;border:1px solid #2b2926;border-radius:7px;background:#faf9f6\">\n<div style=\"font:700 9px ui-monospace,monospace;color:#2b2926;letter-spacing:.07em\">IDENTITY vs PRESENTATION<\u002Fdiv>\n<div style=\"font:11px/1.6 system-ui;color:#4a4743;margin-top:8px\">Belongs here: face, eyes, hair colour &amp; type, skin, body, marks, age band.<br><br>Does <b>not<\u002Fb> belong here: hairstyle of the day, makeup, px\">READINESS<\u002Fspan><span>Draft character failing one or more activation checks<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;gap:12px;padding:8px 0;border-bottom:1px solid #f0ede8;font:11.5px system-ui;color:#3a3835\"><span style=\"width:74px;flex:none;font:700 9px ui-monospace,monospace;color:#8f8a82;padding-top:2px\">AGEING<\u002Fspan><span>Any asset pending review for more than <b>48 hours<\u002Fb><\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;gap:12px;padding:8px 0;border-bottom:1px solid #f0ede8;font:11.5px system-ui;color:#3a3835\"><span style=\"width:74px;flex:none;font:700 9px ui-monospace,monospace;color:#8f8a82;padding-top:2px\">DRIFT<\u002Fspan><span>Identity draft untouched for 14+ days — someone started a rework and stopped<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;gap:12px;padding:8px 0;font:11.5px system-ui;color:#3a3835\"><span style=\"width:74px;flex:none;font:700 9px ui-monospace,monospace;color:#8f8a82;padding-top:2px\">INTEGRITY<\u002Fspan><span>Asset row whose file is missing from storage — the PoC's <span style=\"font:10.5px ui-monospace,monospace\">/tmp<\u002Fspan> wipe, surfaced instead of hidden<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:14px;padding:11px;background:#faf9f6;border:1px solid #dcd9d3;border-radius:6px;font:11px/1.6 system-ui;color:#4a4743\"><b style=\"color:#2b2926\">Severity, not a flat list.<\u002Fb> Blockers (something is wrong <i>in production right now<\u002Fi>) sort above readiness items (something isn't finished yet). Only blockers colour red; everything else stays greyscale, or the operator stops reading warnings.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"width:480px;background:#fff;border:1px solid #d5d2cc;border-radius:8px;padding:18px\">\n<div style=\"font:700 12px system-ui;color:#1f1d1b\">Rendered in three places — the brief asks \"which one?\", the answer is all three<\u002Fdiv>\n<div style=\"margin-top:13px;display:flex;flex-direction:column;gap:12px\">\n<div style=\"border:1px solid #dcd9d3;border-radius:6px;padding:11px\"><div style=\"font:600 11.5px system-ui;color:#1f1d1b\">1 · Today block <a class=\"dv-oid\" href=\"#W01\" style=\"text-decoration:none\">W01<\u002Fa><\u002Fdiv><div style=\"font:11px/1.55 system-ui;color:#6b6660;margin-top:4px\">Cross-character triage list with a fix action per row. This is the <b>daily<\u002Fb> surface.<\u002Fdiv><\u002Fdiv>\n<div style=\"border:1px solid #dcd9d3;border-radius:6px;padding:11px\"><div style=\"font:600 11.5px system-ui;color:#1f1d1b\">2 · Catalogue filter chip + card flag <a class=\"dv-oid\" href=\"#W02\" style=\"text-decoration:none\">W02<\u002Fa><\u002Fdiv><div style=\"font:11px/1.55 system-ui;color:#6b6660;margin-top:4px\">For the operator already browsing. The dark card border does the work; the chip narrows to only affected characters.<\u002Fdiv><\u002Fdiv>\n<div style=\"border:1px solid #dcd9d3;border-radius:6px;padding:11px\"><div style=\"font:600 11.5px system-ui;color:#1f1d1b\">3 · Character Detail banner + readiness rail <a class=\"dv-oid\" href=\"#1b\">1b<\u002Fa> <a class=\"dv-oid\" href=\"#1c\">1c<\u002Fa><\u002Fdiv><div style=\"font:11px/1.55 system-ui;color:#6b6660;margin-top:4px\">In context, with the fix one click away. Never a link to a separate page.<\u002Fdiv><\u002Fdiv>\n<div style=\"border:1px dashed #cbc7c0;border-radius:6px;padding:11px;font:11px/1.55 system-ui;color:#6b6660\"><b style=\"color:#2b2926\">Not a dedicated nav item.<\u002Fb> A page you must remember to visit is a page that goes unvisited. The sidebar Review Queue badge already carries the persistent count.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:14px;font:11px/1.55 system-ui;color:#4a4743\"><b style=\"color:#2b2926\">States<\u002Fb> — healthy (Today shows a calm \"all clear\" block, not a hidden section); 20+ items (grouped by character, \"show all\"); stale data (evaluated server-side per request, no client caching of warnings).<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div id= >\n<div style=\"margin-top:13px\"><div style=\"font:600 11px system-ui;color:#3a3835;margin-bottom:5px\">Reason <span style=\"font:10px ui-monospace,monospace;color:#8f8a82\">— appears in Activity<\u002Fspan><\u002Fdiv><div style=\"border:1px solid #cbc7c0;border-radius:5px;padding:8px 10px;font:11.5px system-ui;color:#a5a098\">e.g. reworking her visual identity<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"border-top:1px solid #dcd9d3;background:#faf9f6;padding:12px 20px;display:flex;gap:9px;justify-content:flex-end\"><div style=\"background:#fff;border:1px solid #cbc7c0;color:#3a3835;font:600 11.5px system-ui;padding:8px 15px;border-radius:5px\">Cancel<\u002Fdiv><div style=\"background:#e11d48;color:#fff;font:600 11.5px system-ui;padding:9px 16px;border-radius:5px\">Deactivate<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:1;min-width:420px;background:#fff;border:1px solid #d5d2cc;border-radius:8px;padding:18px;font:11.5px/1.65 system-ui;color:#4a4743\">\n<div style=\"font:700 12px system-ui;color:#1f1d1b\">Rules for destructive confirmation<\u002Fdiv>\n<div style=\"margin-top:11px;display:flex;flex-direction:column;gap:9px\">\n<div><b style=\"color:#2b2926\">State the consequence, not the action.<\u002Fb> \"She will be removed from the live catalogue\" beats \"Are you sure?\".<\u002Fdiv>\n<div><b style=\"color:#2b2926\">Say what survives.<\u002Fb> Most operator hesitation is fear of losing work. The kept/changed split removes it and prevents the \"let me ask a developer first\" reflex the epic exists to kill.<\u002Fdiv>\n<div><b style=\"color:#2b2926\">Reason field, optional but prompted.<\u002Fb> Costs three seconds, saves an archaeology session later. It is the replacement for a commit message.<\u002Fdiv>\n<div><b style=\"color:#2b2926\">Red only here.<\u002Fb> Rose/red is reserved for two things in the whole admin: the explicit-content bar and the confirmed destructive button.<\u002Fdiv>\n<div><b style=\"color:#2b2926\">No confirmation for reversible acts.<\u002Fb> Approve, reject, retire, reorder → inline undo toast (10s). Modal fatigue is what makes people click through the one modal that mattered.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:13px;padding-top:12px;border-top:1px solid #ece9e4\"><b style=\"color:#2b2926\">Same pattern, other destructive moments:<\u002Fb> activating a different identity version (\"all future generations will use v3\"); removing a primary reference from a live character (\"her profile will show 2 images instead of 3\"); retiring the last primary reference (blocked outright, with an explanation).<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"W16\" style=\"scroll-margin-top:16px\">\n<div style=\"display:flex;align-items:baseline;gap:10px;margin-bottom:9px\"><span style=\"font:700 10.5px ui-monospace,monospace;background:#1a1a1a;color:#fff;padding:3px 7px;border-radius:4px\">W16<\u002Fspan><span style=\"font:600 13px system-ui;color:#1a1a1a\">System states — the set every screen draws from<\u002Fspan><\u002Fdiv>\n<div style=\"width:1180px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px\">\n<div style=\"background:#fff;border:1px solid #d5d2cc;border-radius:8px;padding:14px\"><div style=\"font:700 9px ui-monospace,monospace;color:#8f8a82;letter-spacing:.07em\">EMPTY — FIRST RUN<\u002Fdiv><div style=\"margin-top:11px;border:1px dashed #cbc7c0;border-radius:6px;padding:20px;text-align:center\"><div style=\"width:34px;height:34px;border:1px solid #cbc7c0;border-radius:8px;margin:0 auto\"><\u002Fdiv><div style=\"font:600 12px system-ui;color:#1f1d1b;margin-top:10px\">No characters yet<\u002Fdiv><div style=\"font:11px/1.5 system-ui;color:#7d7871;margin-top:5px\">Create your first AI creator — no developer required.<\u002Fdiv><div style=\"background:#2b2926;color:#fff;font:600 11px system-ui;padding:7px 12px;border-radius:5px;display:inline-block;margin-top:11px\">+ New character<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"background:#fff;border:1px solid #d5d2cc;border-radius:8px;padding:14px\"><div style=\"font:700 9px ui-monospace,monospace;color:#8f8a82;letter-spacing:.07em\">LOADING — SKELETON<\u002Fdiv><div style=\"margin-top:11px;display:grid;grid-template-columns:1fr 1fr;gap:9px\"><div><div style=\"height:74px;background:#ece9e4;border-radius:5px\"><\u002Fdiv><div style=\"height:6px;width:70%;background:#ece9e4;border-radius:3px;margin-top:6px\"><\u002Fdiv><\u002Fdiv><div><div style=\"height:74px;background:#ece9e4;border-radius:5px\"><\u002Fdiv><div style=\"height:6px;width:55%;background:#ece9e4;border-radius:3px;margin-top:6px\"><\u002Fdiv><\u002Fdiv><div><div style=\"height:74px;background:#ece9e4;border-radius:5px\"><\u002Fdiv><div style=\"height:6px;width:64%;background:#ece9e4;border-radius:3px;margin-top:6px\"><\u002Fdiv><\u002Fdiv><div><div style=\"height:74px;background:#ece9e4;border-radius:5px\"><\u002Fdiv><div style=\"height:6px;width:48%;background:#ece9e4;border-radius:3px;margin-top:6px\"><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"font:10.5px/1.5 system-ui;color:#7d7871;margin-top:9px\">Shape-matched skeletons, never spinners on grids — layout must not jump.<\u002Fdiv><\u002Fdiv>\n<div style=\"background:#fff;border:1px solid #d5d2cc;border-radius:8px;padding:14px\"><div style=\"font:700 9px ui-monospace,monospace;color:#8f8a82;letter-spacing:.07em\">ERROR — RECOVERABLE<\u002Fdiv><div style=\"margin-top:11px;border:1px solid #2b2926;border-radius:6px;padding:12px\"><div style=\"font:600 11.5px system-ui;color:#1f1d1b\">Couldn't load media<\u002Fdiv><div style=\"font:11px/1.5 system-ui;color:#6b6660;margin-top:5px\">The library didn't respond. Your filters are still applied.<\u002Fdiv><div style=\"display:flex;gap:7px;margin-top:10px\"><span style=\"background:#2b2926;color:#fff;font:600 10.5px system-ui;padding:5px 11px;border-radius:4px\">Retry<\u002Fspan><span style=\"border:1px solid #cbc7c0;font:600 10.5px system-ui;padding:4px 11px;border-radius:4px\">Report<\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"font:10.5px/1.5 system-ui;color:#7d7871;margin-top:9px\">Plain language, no status codes, never a blank page.<\u002Fdiv><\u002Fdiv>\n<div style=\"background:#fff;border:1px solid #d5d2cc;border-radius:8px;padding:14px\"><div style=\"font:700 9px ui-monospace,monospace;color:#8f8a82;letter-spacing:.07em\">PERMISSION / DISABLED<\u002Fdiv><div style=\"margin-top:11px;border:1px solid #dcd9d3;border-radius:6px;padding:12px\"><div style=\"background:#e8e5e0;color:#a5a098;font:600 11px system-ui;padding:8px;border-radius:5px;text-align:center\">Activate character<\u002Fdiv><div style=\"margin-top:8px;padding:8px;background:#2b2926;color:#fff;font:10.5px/1.45 system-ui;border-radius:5px\">Needs 1 approved primary reference. <span style=\"text-decoration:underline\">Review 2 uploads<\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"font:10.5px/1.5 system-ui;color:#7d7871;margin-top:9px\">A disabled control always explains itself and offers the fix. Read-only operators see actions <i>hidden<\u002Fi>, not greyed.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fsection>\n<section style=\"padding:40px 44px 34px;border-bottom:1px solid rgba(0,0,0,.08);max-width:1300px\" id=\"inventory\">\n<div style=\"font:700 10px ui-monospace,Menlo,monospace;letter-spacing:.09em;color:#8f8a82\">PART E + F<\u002Fdiv>\n<h2 style=\"font:700 22px system-ui;color:#1a1a1a;margin:8px 0 20px\">Component inventory &amp; state matrix<\u002Fh2>\n<div style=\"display:flex;gap:22px;flex-wrap:wrap\">\n<div style=\"flex:1;min-width:540px;background:#fff;border:1px solid #d5d2cc;border-radius:8px;padding:20px\">\n<div style=\"font:700 12px system-ui;color:#1f1d1b\">Components to build — 21, of which 6 do most of the work<\u002Fdiv>\n<div style=\"margin-top:14px;font:10px ui-monospace,monospace;color:#8f8a82;letter-spacing:.06em\">SHELL<\u002Fdiv>\n<div style=\"margin-top:6px;font:11.5px/1.8 system-ui;color:#3a3835\"><b>AdminShell<\u002Fb> (sidebar + topbar, desktop) · <b>SidebarNav<\u002Fb> with count badges · <b>Breadcrumb<\u002Fb><\u002Fdiv>\n<div style=\"margin-top:12px;font:10px ui-monospace,monospace;color:#8f8a82;letter-spacing:.06em\">CORE SIX — everything else composes these<\u002Fdiv>\n<div style=\"margin-top:6px;font:11.5px/1.8 system-ui;color:#3a3835\"><b>StateBadge<\u002Fb> (one component, every state + rating; the vocabulary at the top of this doc) · <b>MediaTile<\u002Fb> (image/video, badges, selection) · <b>MediaGrid<\u002Fb> (+ filter bar, bulk bar, empty/loading/error) · <b>MediaDrawer<\u002Fb> (detail + decisions, keyboard nav) · <b>ReadinessChecklist<\u002Fb> (blockers vs warnings, fix links — used on Detail rail, wizard step 5, Publishing) · <b>AttentionList<\u002Fb> (the rules engine's rendering)<\u002Fdiv>\n<div style=\"margin-top:12px;font:10px ui-monospace,monospace;color:#8f8a82;letter-spacing:.06em\">CHARACTER<\u002Fdiv>\n<div style=\"margin-top:6px;font:11.5px/1.8 system-ui;color:#3a3835\"><b>CharacterCard<\u002Fb> (admin variant) · <b>CharacterTable<\u002Fb> (list view) · <b>CharacterHeader<\u002Fb> · <b>TabBar<\u002Fb> · <b>PublicationRail<\u002Fb> · <b>IdentityVersionList<\u002Fb> · <b>VisualDnaEditor<\u002Fb> · <b>PrimarySetEditor<\u002Fb> (drag-reorder)<\u002Fdiv>\n<div style=\"margin-top:12px;font:10px ui-monospace,monospace;color:#8f8a82;letter-spacing:.06em\">FLOW &amp; FEEDBACK<\u002Fdiv>\n<div style=\"margin-top:6px;font:11.5px/1.8 system-ui;color:#3a3835\"><b>WizardStepper<\u002Fb> · <b>ConfirmDialog<\u002Fb> (consequence/kept/changed/reason) · <b>UndoToast<\u002Fb> · <b>FilterChipRow<\u002Fb> · <b>Uploader<\u002Fb> (drag-drop, progress, retry) · <b>ActivityFeed<\u002Fb> · <b>EmptyState<\u002Fb> (extend the existing <span style=\"font:10.5px ui-monospace,monospace\">EmptyState.tsx<\u002Fspan>)<\u002Fdiv>\n<div style=\"margin-top:14px;padding:11px;background:#faf9f6;border:1px solid #dcd9d3;border-radius:6px;font:11px/1.6 system-ui;color:#4a4743\"><b style=\"color:#2b2926\">Reused from the existing app:<\u002Fb> <span style=\"font:10.5px ui-monospace,monospace\">EmptyState<\u002Fspan>, <span style=\"font:10.5px ui-monospace,monospace\">PageHeader<\u002Fspan>, the Tailwind zinc/rose token usage, and the image-failure fallback logic already in <span style=\"font:10.5px ui-monospace,monospace\">CharacterCard.tsx<\u002Fspan>. <b style=\"color:#2b2926\">Deliberately not reused:<\u002Fb> <span style=\"font:10.5px ui-monospace,monospace\">AppShell<\u002Fspan> (mobile bottom nav, 512px cap) and <span style=\"font:10.5px ui-monospace,monospace\">MediaGallery<\u002Fspan> / <span style=\"font:10.5px ui-monospace,monospace\">MediaViewer<\u002Fspan> (consumer premium-gating semantics don't apply to an operator).<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"flex:1;min-width:540px;background:#fff;border:1px solid #d5d2cc;border-radius:8px;padding:20px\">\n<div style=\"font:700 12px system-ui;color:#1f1d1b\">Which asset states are visible where<\u002Fdiv>\n<div style=\"margin-top:14px;overflow-x:auto\">\n<div style=\"display:grid;grid-template-columns:150px repeat(4,1fr);gap:0;font:11px system-ui;min-width:520px\">\n<div style=\"font:700 9px ui-monospace,monospace;color:#8f8a82;padding:7px 6px;border-bottom:1px solid #dcd9d3\">ASSET STATE<\u002Fdiv>\n<div style=\"font:700 9px ui-monospace,monospace;color:#8f8a82;padding:7px 6px;border-bottom:1px solid #dcd9d3\">MEDIA LIB<\u002Fdiv>\n<div style=\"font:700 9px ui-monospace,monospace;color:#8f8a82;padding:7px 6px;border-bottom:1px solid #dcd9d3\">QUEUE<\u002Fdiv>\n<div style=\"font:700 9px ui-monospace,monospace;color:#8f8a82;padding:7px 6px;border-bottom:1px solid #dcd9d3\">GENERATION<\u002Fdiv>\n<div style=\"font:700 9px ui-monospace,monospace;color:#8f8a82;padding:7px 6px;border-bottom:1px solid #dcd9d3\">USERS<\u002Fdiv>\n\n<div style=\"padding:7px 6px;border-bottom:1px solid #f0ede8;color:#3a3835\">Generated / uploaded<\u002Fdiv><div style=\"padding:7px 6px;border-bottom:1px solid #f0ede8\">✓<\u002Fdiv><div style=\"padding:7px 6px;border-bottom:1px solid #f0ede8;color:#a5a098\">—<\u002Fdiv><div style=\"padding:7px 6px;border-bottom:1px solid #f0ede8;color:#a5a098\">—<\u002Fdiv><div style=\"padding:7px 6px;border-bottom:1px solid #f0ede8;color:#a5a098\">—<\u002Fdiv>\n\n<div style=\"padding:7px 6px;border-bottom:1px solid #f0ede8;color:#3a3835\">Under review<\u002Fdiv><div style=\"padding:7px 6px;border-bottom:1px solid #f0ede8\">✓<\u002Fdiv><div style=\"padding:7px 6px;border-bottom:1px solid #f0ede8\">✓<\u002Fdiv><div style=\"padding:7px 6px;border-bottom:1px solid #f0ede8;color:#a5a098\">—<\u002Fdiv><div style=\"padding:7px 6px;border-bottom:1px solid #f0ede8;color:#a5a098\">—<\u002Fdiv>\n\n<div style=\"padding:7px 6px;border-bottom:1px solid #f0ede8;color:#3a3835\">Approved, not primary<\u002Fdiv><div style=\"padding:7px 6px;border-bottom:1px solid #f0ede8\">✓<\u002Fdiv><div style=\"padding:7px 6px;border-bottom:1px solid #f0ede8;color:#a5a098\">—<\u002Fdiv><div style=\"padding:7px 6px;border-bottom:1px solid #f0ede8\">✓ ref only<\u002Fdiv><div style=\"padding:7px 6px;border-bottom:1px solid #f0ede8;color:#a5a098\">—<\u002Fdiv>\n\n<div style=\"padding:7px 6px;border-bottom:1px solid #f0ede8;color:#1f1d1b;font-weight:600\">Approved + primary, active identity<\u002Fdiv><div style=\"padding:7px 6px;border-bottom:1px solid #f0ede8\">✓<\u002Fdiv><div style=\"padding:7px 6px;border-bottom:1px solid #f0ede8;color:#a5a098\">—<\u002Fdiv><div style=\"padding:7px 6px;border-bottom:1px solid #f0ede8\">✓<\u002Fdiv><div style=\"padding:7px 6px;border-bottom:1px solid #f0ede8\"><b>✓ PUBLISHED<\u002Fb><\u002Fdiv>\n\n<div style=\"padding:7px 6px;border-bottom:1px solid #f0ede8;color:#3a3835\">Approved + primary, <i>retired<\u002Fi> identity<\u002Fdiv><div style=\"padding:7px 6px;border-bottom:1px solid #f0ede8\">✓<\u002Fdiv><div style=\"padding:7px 6px;border-bottom:1px solid #f0ede8;color:#a5a098\">—<\u002Fdiv><div style=\"padding:7px 6px;border-bottom:1px solid #f0ede8;color:#a5a098\">—<\u002Fdiv><div style=\"padding:7px 6px;border-bottom:1px solid #f0ede8;color:#a5a098\">—<\u002Fdiv>\n\n<div style=\"padding:7px 6px;border-bottom:1px solid #f0ede8;color:#3a3835\">Rejected<\u002Fdiv><div style=\"padding:7px 6px;border-bottom:1px solid #f0ede8\">✓ filtered out by default<\u002Fdiv><div style=\"padding:7px 6px;border-bottom:1px solid #f0ede8;color:#a5a098\">—<\u002Fdiv><div style=\"padding:7px 6px;border-bottom:1px solid #f0ede8;color:#a5a098\">—<\u002Fdiv><div style=\"padding:7px 6px;border-bottom:1px solid #f0ede8;color:#a5a098\">—<\u002Fdiv>\n\n<div style=\"padding:7px 6px;color:#3a3835\">Retired<\u002Fdiv><div style=\"padding:7px 6px\">✓ filtered out by default<\u002Fdiv><div style=\"padding:7px 6px;color:#a5a098\">—<\u002Fdiv><div style=\"padding:7px 6px;color:#a5a098\">—<\u002Fdiv><div style=\"padding:7px 6px;color:#a5a098\">—<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:14px;padding:11px;background:#faf9f6;border:1px solid #dcd9d3;border-radius:6px;font:11px/1.6 system-ui;color:#4a4743\">Read row 5: retiring an identity version <b>silently unpublishes its primary set<\u002Fb>. That is correct behaviour and today invisible — which is exactly why activating a new identity version gets a confirmation that names how many published images will change.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"padding:40px 44px 34px;border-bottom:1px solid rgba(0,0,0,.08);max-width:1300px\" id=\"decisions\">\n<div style=\"font:700 10px ui-monospace,Menlo,monospace;letter-spacing:.09em;color:#8f8a82\">PART I<\u002Fdiv>\n<h2 style=\"font:700 22px system-ui;color:#1a1a1a;margin:8px 0 6px\">Open product decisions — six, all genuinely yours<\u002Fh2>\n<p style=\"max-width:760px;font:13px/1.65 system-ui;color:#4a4743;margin:0 0 20px\">Everything else I resolved with UX judgement and recorded above. These six change scope or policy, so I've stated a recommendation and what it costs to disagree.<\u002Fp>\n<div style=\"display:flex;flex-direction:column;gap:12px\">\n\n<div style=\"background:#fff;border:1px solid #d5d2cc;border-radius:8px;padding:16px 18px;display:flex;gap:18px\">\n<div style=\"width:52px;flex:none;font:700 12px ui-monospace,monospace;color:#8f8a82\">OD-1<\u002Fdiv>\n<div style=\"flex:1\"><div style=\"font:600 12.5px system-ui;color:#1f1d1b\">Who can approve adult content, and does approval need a second pair of eyes?<\u002Fdiv><div style=\"font:11.5px/1.6 system-ui;color:#4a4743;margin-top:6px\">The whole design assumes <b>one operator role<\u002Fb> that can create, approve and publish. If explicit media legally or commercially requires a separate approver, the review queue becomes a two-stage pipeline and every \"approve\" button needs a role check. <b>My recommendation:<\u002Fb> single role for the PoC, design the queue so a second stage can be inserted without redrawing it.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"background:#fff;border:1px solid #d5d2cc;border-radius:8px;padding:16px 18px;display:flex;gap:18px\">\n<div style=\"width:52px;flex:none;font:700 12px ui-monospace,monospace;color:#8f8a82\">OD-2<\u002Fdiv>\n<div style=\"flex:1\"><div style=\"font:600 12.5px system-ui;color:#1f1d1b\">Is generated media ever shown to users, or only primary references?<\u002Fdiv><div style=\"font:11.5px/1.6 system-ui;color:#4a4743;margin-top:6px\">Today the API publishes <i>only<\u002Fi> approved primary references, so an approved generated video can never reach a user. If generated video is meant to appear in Discover (the code has a video-first seam waiting for it), publishing needs its own explicit flag rather than riding on <span style=\"font:10.5px ui-monospace,monospace\">is_canonical<\u002Fspan> — a real data-model decision, and the single biggest fork in this epic. <b>My recommendation:<\u002Fb> add an explicit \"publish to profile\" flag on approved assets; it makes Approved-vs-Published operator-controlled instead of implied.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"background:#fff;border:1px solid #d5d2cc;border-radius:8px;padding:16px 18px;display:flex;gap:18px\">\n<div style=\"width:52px;flex:none;font:700 12px ui-monospace,monospace;color:#8f8a82\">OD-3<\u002Fdiv>\n<div style=\"flex:1\"><div style=\"font:600 12.5px system-ui;color:#1f1d1b\">Can operators trigger generation from the admin — and who pays?<\u002Fdiv><div style=\"font:11.5px/1.6 system-ui;color:#4a4743;margin-top:6px\">The pipeline exists behind an internal token with a cost ledger and per-character budget. Exposing \"Generate media\" in the UI <a class=\"dv-oid\" href=\"#W09\" style=\"text-decoration:none\">W09<\u002Fa> means an operator can spend real money in one click. Needs: budget display, confirm-with-cost, or omit the button entirely for v1. <b>My recommendation:<\u002Fb> ship v1 read-only with upload; add generation in a later story with a visible remaining-budget meter.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"background:#fff;border:1px solid #d5d2cc;border-radius:8px;padding:16px 18px;display:flex;gap:18px\">\n<div style=\"width:52px;flex:none;font:700 12px ui-monospace,monospace;color:#8f8a82\">OD-4<\u002Fdiv>\n<div style=\"flex:1\"><div style=\"font:600 12.5px system-ui;color:#1f1d1b\">What happens to live conversations when a character is deactivated?<\u002Fdiv><div style=\"font:11.5px/1.6 system-ui;color:#4a4743;margin-top:6px\">W15 currently promises conversations survive and only discovery is hidden. If deactivation should also stop existing chats replying, the copy — and the operator's mental model — changes materially. <b>My recommendation:<\u002Fb> hide from discovery, keep existing chats working; anything else is a user-facing breakage disguised as an admin action.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"background:#fff;border:1px solid #d5d2cc;border-radius:8px;padding:16px 18px;display:flex;gap:18px\">\n<div style=\"width:52px;flex:none;font:700 12px ui-monospace,monospace;color:#8f8a82\">OD-5<\u002Fdiv>\n<div style=\"flex:1\"><div style=\"font:600 12.5px system-ui;color:#1f1d1b\">Is Retired needed for the PoC, for characters and for media?<\u002Fdiv><div style=\"font:11.5px/1.6 system-ui;color:#4a4743;margin-top:6px\">The only schema additions this design asks for. Paused already covers \"not live\". <b>My recommendation:<\u002Fb> add retired for <i>media<\u002Fi> (operators need \"superseded, not bad\"); defer retired for <i>characters<\u002Fi> until there are enough of them for Paused to feel crowded.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"background:#fff;border:1px solid #d5d2cc;border-radius:8px;padding:16px 18px;display:flex;gap:18px\">\n<div style=\"width:52px;flex:none;font:700 12px ui-monospace,monospace;color:#8f8a82\">OD-6<\u002Fdiv>\n<div style=\"flex:1\"><div style=\"font:600 12.5px system-ui;color:#1f1d1b\">Where do asset files actually live?<\u002Fdiv><div style=\"font:11.5px/1.6 system-ui;color:#4a4743;margin-top:6px\">Generated assets currently write to local disk and the code itself warns that a redeploy can wipe them. An operator-facing library that shows \"file unavailable\" tiles is honest but not acceptable long-term. Object storage is a prerequisite for upload — not strictly a design decision, but it gates W05 and W10. <b>My recommendation:<\u002Fb> treat durable storage as a hard dependency of the first implementation story.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"padding:40px 44px 46px;max-width:1300px\" id=\"sequence\">\n<div style=\"font:700 10px ui-monospace,Menlo,monospace;letter-spacing:.09em;color:#8f8a82\">PART J<\u002Fdiv>\n<h2 style=\"font:700 22px system-ui;color:#1a1a1a;margin:8px 0 6px\">Recommended implementation sequence<\u002Fh2>\n<p style=\"max-width:760px;font:13px/1.65 system-ui;color:#4a4743;margin:0 0 20px\">Ordered so that every slice ends with the operator able to do something they previously needed a developer for. Nothing here is a \"foundations sprint\" with no user-visible result.<\u002Fp>\n<div style=\"display:flex;flex-direction:column;gap:11px\">\n<div style=\"background:#fff;border:1px solid #d5d2cc;border-radius:8px;padding:15px 18px;display:flex;gap:18px\"><div style=\"width:44px;flex:none;font:700 15px system-ui;color:#c0bbb3\">1<\u002Fdiv><div><div style=\"font:600 12.5px system-ui;color:#1f1d1b\">Admin shell, auth gate, catalogue read-only <span style=\"font:10px ui-monospace,monospace;color:#8f8a82\">W02 · US-99<\u002Fspan><\u002Fdiv><div style=\"font:11.5px/1.6 system-ui;color:#4a4743;margin-top:4px\">Route tree at <span style=\"font:10.5px ui-monospace,monospace\">/admin<\u002Fspan>, sidebar, StateBadge, CharacterCard. Needs an admin-scoped characters endpoint that returns inactive rows too (the public one filters them out). <b>Ends with:<\u002Fb> the operator can see the catalogue and its true state for the first time.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"background:#fff;border:1px solid #d5d2cc;border-radius:8px;padding:15px 18px;display:flex;gap:18px\"><div style=\"width:44px;flex:none;font:700 15px system-ui;color:#c0bbb3\">2<\u002Fdiv><div><div style=\"font:600 12.5px system-ui;color:#1f1d1b\">Character Detail — Overview, Persona, editing <span style=\"font:10px ui-monospace,monospace;color:#8f8a82\">W07 · US-99<\u002Fspan><\u002Fdiv><div style=\"font:11.5px/1.6 system-ui;color:#4a4743;margin-top:4px\">Header, tabs, rail shell, persona edit + save. <b>Ends with:<\u002Fb> bios and personalities change without a commit.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"background:#fff;border:1px solid #d5d2cc;border-radius:8px;padding:15px 18px;display:flex;gap:18px\"><div style=\"width:44px;flex:none;font:700 15px system-ui;color:#c0bbb3\">3<\u002Fdiv><div><div style=\"font:600 12.5px system-ui;color:#1f1d1b\">Readiness engine + activation / deactivation <span style=\"font:10px ui-monospace,monospace;color:#8f8a82\">W13 · W15 · US-102<\u002Fspan><\u002Fdiv><div style=\"font:11.5px/1.6 system-ui;color:#4a4743;margin-top:4px\">One server-side rules evaluation reused by rail, wizard and Publishing. <b>Ends with:<\u002Fb> the deploy-to-go-live workflow is dead. This is the epic's core promise and should land early, not last.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"background:#fff;border:1px solid #d5d2cc;border-radius:8px;padding:15px 18px;display:flex;gap:18px\"><div style=\"width:44px;flex:none;font:700 15px system-ui;color:#c0bbb3\">4<\u002Fdiv><div><div style=\"font:600 12.5px system-ui;color:#1f1d1b\">Media grid + drawer, character-scoped <span style=\"font:10px ui-monospace,monospace;color:#8f8a82\">W09 · W11 · US-100<\u002Fspan><\u002Fdiv><div style=\"font:11.5px/1.6 system-ui;color:#4a4743;margin-top:4px\">MediaTile / MediaGrid / MediaDrawer built once, reused by W10 and W12. Depends on <b>OD-6<\u002Fb> (durable storage) for upload. <b>Ends with:<\u002Fb> assets are inspectable without a database client.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"background:#fff;border:1px solid #d5d2cc;border-radius:8px;padding:15px 18px;display:flex;gap:18px\"><div style=\"width:44px;flex:none;font:700 15px system-ui;color:#c0bbb3\">5<\u002Fdiv><div><div style=\"font:600 12.5px system-ui;color:#1f1d1b\">Approval actions + Review Queue <span style=\"font:10px ui-monospace,monospace;color:#8f8a82\">W12 · US-100<\u002Fspan><\u002Fdiv><div style=\"font:11.5px/1.6 system-ui;color:#4a4743;margin-top:4px\">Approve / reject / retire with approver stamping and undo; the queue is a filtered MediaGrid plus keyboard sequencing. <b>Ends with:<\u002Fb> a real content-safety workflow exists.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"background:#fff;border:1px solid #d5d2cc;border-radius:8px;padding:15px 18px;display:flex;gap:18px\"><div style=\"width:44px;flex:none;font:700 15px system-ui;color:#c0bbb3\">6<\u002Fdiv><div><div style=\"font:600 12.5px system-ui;color:#1f1d1b\">Visual Identity versioning <span style=\"font:10px ui-monospace,monospace;color:#8f8a82\">W08 · US-101<\u002Fspan><\u002Fdiv><div style=\"font:11.5px/1.6 system-ui;color:#4a4743;margin-top:4px\">Version list, DNA editor, primary set, activate-version confirmation. Highest-risk screen — deliberately after the operator is fluent in the rest of the admin.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"background:#fff;border:1px solid #d5d2cc;border-radius:8px;padding:15px 18px;display:flex;gap:18px\"><div style=\"width:44px;flex:none;font:700 15px system-ui;color:#c0bbb3\">7<\u002Fdiv><div><div style=\"font:600 12.5px system-ui;color:#1f1d1b\">Create Character wizard <span style=\"font:10px ui-monospace,monospace;color:#8f8a82\">W03–W06 · US-99<\u002Fspan><\u002Fdiv><div style=\"font:11.5px/1.6 system-ui;color:#4a4743;margin-top:4px\">Deliberately late: it is a thin orchestration of steps 2–6, and building it earlier means building each step twice. <b>Ends with:<\u002Fb> the Maria onboarding story is fully self-service.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"background:#fff;border:1px solid #d5d2cc;border-radius:8px;padding:15px 18px;display:flex;gap:18px\"><div style=\"width:44px;flex:none;font:700 15px system-ui;color:#c0bbb3\">8<\u002Fdiv><div><div style=\"font:600 12.5px system-ui;color:#1f1d1b\">Global Media Library, Today, Activity <span style=\"font:10px ui-monospace,monospace;color:#8f8a82\">W01 · W10 · W14 · US-103<\u002Fspan><\u002Fdiv><div style=\"font:11.5px/1.6 system-ui;color:#4a4743;margin-top:4px\">All three are aggregations of work already done. <b>The dashboard is built last on purpose<\u002Fb> — it can only summarise states that exist.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:22px;padding:16px 18px;background:#fff;border:1px solid #2b2926;border-radius:8px;max-width:900px;font:12px/1.7 system-ui;color:#3a3835\"><b style=\"color:#1f1d1b\">Nothing has been implemented.<\u002Fb> No repository files were modified, no schema changes made. Pick a Character Detail structure — <a class=\"dv-oid\" href=\"#1a\">1a<\u002Fa>, <a class=\"dv-oid\" href=\"#1b\">1b<\u002Fa> or <a class=\"dv-oid\" href=\"#1c\">1c<\u002Fa> — and answer <b>OD-2<\u002Fb> and <b>OD-6<\u002Fb>, and slice 1 is ready to hand to engineering.<\u002Fdiv>\n<\u002Fsection><\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
